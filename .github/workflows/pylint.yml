name: Python CI

on:
  push:
  pull_request:

jobs:
  onprem-systemd:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .:llm_notable_analysis_onprem_systemd/src:onprem-llm-sdk/src
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pylint requests

      - name: Lint Python sources
        run: |
          python -m pylint --errors-only --disable=import-error \
            llm_notable_analysis_onprem_systemd/src \
            llm_notable_analysis_onprem_systemd/tests \
            onprem-llm-sdk/src \
            onprem_rag_notable_analysis

      - name: Run on-prem service tests
        run: |
          python -m unittest discover \
            -s llm_notable_analysis_onprem_systemd/tests/onprem_service \
            -p "test_*.py"

  s3-notable-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: s3_notable_pipeline
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run Python unit tests
        run: |
          python -m pytest tests -q

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: s3_notable_pipeline/frontend/analyst-portal/package-lock.json

      - name: Install analyst portal dependencies
        working-directory: s3_notable_pipeline/frontend/analyst-portal
        run: npm ci

      - name: Run analyst portal unit tests
        working-directory: s3_notable_pipeline/frontend/analyst-portal
        run: npm test

      - name: Build analyst portal
        working-directory: s3_notable_pipeline/frontend/analyst-portal
        run: npm run build
