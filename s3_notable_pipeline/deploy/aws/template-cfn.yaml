AWSTemplateFormatVersion: '2010-09-09'
Description: S3-triggered notable analysis pipeline using Bedrock Nova Pro (pure CloudFormation)

Parameters:
  InputBucketName:
    Type: String
    Description: Name for the input S3 bucket (notables will be uploaded here)
    Default: notable-input-bucket
  
  OutputBucketName:
    Type: String
    Description: Name for the output S3 bucket (markdown + Bedrock JSON reports for s3 and notable_rest modes)
    Default: notable-output-bucket
  
  SplunkSinkMode:
    Type: String
    Description: Output sink mode
    Default: s3
    AllowedValues:
      - s3
      - notable_rest

  CapabilityProfiles:
    Type: String
    Description: Comma-separated capability profiles for the Lambda runtime.
    Default: core

  HtmlReportEnabled:
    Type: String
    Description: Enables optional HTML companion reports.
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'

  RagEnabled:
    Type: String
    Description: Enables general SOC RAG retrieval from Bedrock Knowledge Bases.
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'

  RagBedrockKbId:
    Type: String
    Description: Bedrock Knowledge Base ID for general SOC advisory context. Required when RagEnabled=true.
    Default: ''

  RagMaxSnippets:
    Type: Number
    Description: Maximum Bedrock Knowledge Base snippets for general SOC RAG.
    Default: 4
    MinValue: 1
    MaxValue: 20

  RagContextBudgetChars:
    Type: Number
    Description: Character budget for rendered general SOC RAG context.
    Default: 1600
    MinValue: 1
    MaxValue: 10000

  RagFailureMode:
    Type: String
    Description: RAG failure behavior. Use suppress for default fail-soft behavior.
    Default: suppress
    AllowedValues:
      - suppress
      - fail_closed

  SplQueryRagBedrockKbId:
    Type: String
    Description: Bedrock Knowledge Base ID for SPL query grounding.
    Default: ''

  InvestigationQueryExecutor:
    Type: String
    Description: Read-only Splunk investigation executor.
    Default: rest
    AllowedValues:
      - rest
      - mcp

  SplunkSearchAllowedIndexes:
    Type: String
    Description: Comma-separated Splunk indexes allowed for read-only investigation queries.
    Default: main,notable,risk

  SplunkSearchMaxRows:
    Type: Number
    Description: Maximum rows returned by one read-only Splunk investigation query.
    Default: 100
    MinValue: 1
    MaxValue: 1000

  SplunkSearchTimeoutSeconds:
    Type: Number
    Description: Timeout in seconds for one read-only Splunk investigation query.
    Default: 30
    MinValue: 1
    MaxValue: 300

  SplunkMcpEndpoint:
    Type: String
    Description: Optional HTTPS MCP bridge endpoint for read-only Splunk investigation.
    Default: ''

  SplunkMcpAuthSecretArn:
    Type: String
    Default: '*'
    AllowedPattern: '^\*$|^arn:(aws|aws-us-gov|aws-cn):secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:.+$'
    ConstraintDescription: Must be * or a valid Secrets Manager secret ARN.
    Description: Optional bearer token secret ARN for Splunk MCP-over-HTTPS.

  SplunkBaseUrl:
    Type: String
    Default: ''
    Description: >-
      Required when SplunkSinkMode=notable_rest. Base URL for Splunk REST
      (e.g., https://splunk.example.com:8089).

  SplunkApiTokenSecretArn:
    Type: String
    Default: '*'
    AllowedPattern: '^\*$|^arn:(aws|aws-us-gov|aws-cn):secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:.+$'
    ConstraintDescription: Must be the s3-mode placeholder * or a valid Secrets Manager secret ARN for notable_rest mode.
    Description: >-
      Required when SplunkSinkMode=notable_rest. Secrets Manager ARN containing
      the Splunk API token (plain string secret or JSON object). Leave the
      default * only for s3 mode.

  SplunkApiTokenSecretField:
    Type: String
    Default: token
    Description: >-
      Optional JSON field name in SplunkApiTokenSecretArn when the secret is a
      JSON object. Ignored for plain-string secrets.

  SplunkNotableUpdatePath:
    Type: String
    Default: /services/notable_update
    Description: Optional Splunk notable update path used by notable_rest mode.
  
  InputRetentionDays:
    Type: Number
    Description: Number of days to retain input notables before automatic deletion
    Default: 2
    MinValue: 1
    MaxValue: 365
  
  OutputRetentionDays:
    Type: Number
    Description: Number of days to retain output reports before automatic deletion
    Default: 7
    MinValue: 1
    MaxValue: 365

  MaxDecompressedInputBytes:
    Type: Number
    Description: Maximum decompressed bytes allowed for one gzip notable input
    Default: 1048576
    MinValue: 1

  LambdaTimeoutSeconds:
    Type: Number
    Description: Lambda timeout in seconds. Keep 360 for core; use 900 as the starting point for heavier parity profiles.
    Default: 360
    MinValue: 1
    MaxValue: 900

  LambdaMemorySize:
    Type: Number
    Description: Lambda memory in MB. Keep 512 for core; use 1024 as the starting point for heavier parity profiles.
    Default: 512
    MinValue: 128
    MaxValue: 10240

  LambdaEphemeralStorageMb:
    Type: Number
    Description: Lambda ephemeral storage in MB.
    Default: 512
    MinValue: 512
    MaxValue: 10240

  AwsAccountId:
    Type: String
    AllowedPattern: '^[0-9]{12}$'
    Description: >-
      Required. Your 12-digit AWS account ID for the Bedrock inference profile ARN
      (replace <awsaccountid> in arn:aws:bedrock:us-east-1:<awsaccountid>:inference-profile/...).
      Pass at deploy time via parameter overrides or stack input.
  
  LambdaCodeS3Bucket:
    Type: String
    Description: S3 bucket containing the Lambda deployment package
  
  LambdaCodeS3Key:
    Type: String
    Description: S3 key for the Lambda deployment package (zip file)
    Default: lambda-package.zip

Rules:
  RequireNotableRestConfig:
    RuleCondition: !Equals [!Ref SplunkSinkMode, notable_rest]
    Assertions:
      - Assert: !Not [!Equals [!Ref SplunkBaseUrl, '']]
        AssertDescription: SplunkBaseUrl is required when SplunkSinkMode=notable_rest.
      - Assert: !Not [!Equals [!Ref SplunkApiTokenSecretArn, '']]
        AssertDescription: SplunkApiTokenSecretArn is required when SplunkSinkMode=notable_rest.
      - Assert: !Not [!Equals [!Ref SplunkApiTokenSecretArn, '*']]
        AssertDescription: SplunkApiTokenSecretArn must be a real Secrets Manager ARN when SplunkSinkMode=notable_rest.

Conditions:
  IsNotableRest: !Equals [!Ref SplunkSinkMode, notable_rest]
  HasRagKnowledgeBase: !Not [!Equals [!Ref RagBedrockKbId, '']]
  HasSplQueryKnowledgeBase: !Not [!Equals [!Ref SplQueryRagBedrockKbId, '']]
  HasSplunkMcpSecret: !Not [!Equals [!Ref SplunkMcpAuthSecretArn, '*']]

Resources:
  InputBucket:
    Type: AWS::S3::Bucket
    DependsOn: LambdaInvokePermission
    Properties:
      BucketName: !Ref InputBucketName
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: s3:ObjectCreated:*
            Function: !GetAtt NotableAnalyzerFunction.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: incoming/
      LifecycleConfiguration:
        Rules:
          - Id: DeleteIncomingNotablesAfterRetention
            Status: Enabled
            Prefix: incoming/
            ExpirationInDays: !Ref InputRetentionDays
  
  OutputBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref OutputBucketName
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOutputReportsAfterRetention
            Status: Enabled
            Prefix: reports/
            ExpirationInDays: !Ref OutputRetentionDays
  
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: NotableAnalyzerLambdaRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: S3AccessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !Sub 'arn:aws:s3:::${InputBucketName}'
                  - !Sub 'arn:aws:s3:::${InputBucketName}/*'
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                Resource:
                  - !Sub 'arn:aws:s3:::${OutputBucketName}/*'
              - !If
                - IsNotableRest
                - Effect: Allow
                  Action:
                    - secretsmanager:GetSecretValue
                  Resource:
                    - !Ref SplunkApiTokenSecretArn
                - !Ref AWS::NoValue
        - PolicyName: BedrockInvokePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource:
                  - !Sub 'arn:aws:bedrock:us-east-1:${AwsAccountId}:inference-profile/us.anthropic.claude-sonnet-4-5-20250929-v1:0'
              - !If
                - HasRagKnowledgeBase
                - Effect: Allow
                  Action:
                    - bedrock:Retrieve
                  Resource:
                    - !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/${RagBedrockKbId}'
                - !Ref AWS::NoValue
              - !If
                - HasSplQueryKnowledgeBase
                - Effect: Allow
                  Action:
                    - bedrock:Retrieve
                  Resource:
                    - !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/${SplQueryRagBedrockKbId}'
                - !Ref AWS::NoValue
              - !If
                - HasSplunkMcpSecret
                - Effect: Allow
                  Action:
                    - secretsmanager:GetSecretValue
                  Resource:
                    - !Ref SplunkMcpAuthSecretArn
                - !Ref AWS::NoValue
        - PolicyName: CloudWatchLogsPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/notable-analyzer-s3:*'
  
  NotableAnalyzerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: notable-analyzer-s3
      Runtime: python3.12
      Handler: s3_notable_pipeline.lambda_handler.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: !Ref LambdaTimeoutSeconds
      MemorySize: !Ref LambdaMemorySize
      EphemeralStorage:
        Size: !Ref LambdaEphemeralStorageMb
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LambdaCodeS3Key
      Environment:
        Variables:
          CAPABILITY_PROFILES: !Ref CapabilityProfiles
          HTML_REPORT_ENABLED: !Ref HtmlReportEnabled
          RAG_ENABLED: !Ref RagEnabled
          RAG_BEDROCK_KB_ID: !Ref RagBedrockKbId
          RAG_MAX_SNIPPETS: !Ref RagMaxSnippets
          RAG_CONTEXT_BUDGET_CHARS: !Ref RagContextBudgetChars
          RAG_FAILURE_MODE: !Ref RagFailureMode
          BEDROCK_MODEL_ID: !Sub 'arn:aws:bedrock:us-east-1:${AwsAccountId}:inference-profile/us.anthropic.claude-sonnet-4-5-20250929-v1:0'
          SPLUNK_SINK_MODE: !Ref SplunkSinkMode
          SPLUNK_BASE_URL: !Ref SplunkBaseUrl
          SPLUNK_API_TOKEN_SECRET_ARN: !Ref SplunkApiTokenSecretArn
          SPLUNK_API_TOKEN_SECRET_FIELD: !Ref SplunkApiTokenSecretField
          SPLUNK_NOTABLE_UPDATE_PATH: !Ref SplunkNotableUpdatePath
          SPL_QUERY_RAG_ENABLED: !If [HasSplQueryKnowledgeBase, 'true', 'false']
          SPL_QUERY_RAG_BEDROCK_KB_ID: !Ref SplQueryRagBedrockKbId
          INVESTIGATION_QUERY_EXECUTOR: !Ref InvestigationQueryExecutor
          SPLUNK_SEARCH_ALLOWED_INDEXES: !Ref SplunkSearchAllowedIndexes
          SPLUNK_SEARCH_MAX_ROWS: !Ref SplunkSearchMaxRows
          SPLUNK_SEARCH_TIMEOUT_SECONDS: !Ref SplunkSearchTimeoutSeconds
          SPLUNK_MCP_ENDPOINT: !Ref SplunkMcpEndpoint
          SPLUNK_MCP_AUTH_SECRET_ARN: !Ref SplunkMcpAuthSecretArn
          INPUT_BUCKET_NAME: !Ref InputBucketName
          OUTPUT_BUCKET_NAME: !Ref OutputBucketName
          OUTPUT_PREFIX: reports
          MAX_DECOMPRESSED_INPUT_BYTES: !Ref MaxDecompressedInputBytes
  
  LambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref NotableAnalyzerFunction
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceArn: !Sub 'arn:aws:s3:::${InputBucketName}'

Outputs:
  FunctionArn:
    Description: Lambda Function ARN
    Value: !GetAtt NotableAnalyzerFunction.Arn
  
  InputBucketName:
    Description: Input S3 bucket name
    Value: !Ref InputBucket
  
  OutputBucketName:
    Description: Output S3 bucket name
    Value: !Ref OutputBucket
  
  TestCommand:
    Description: Command to upload a test notable
    Value: !Sub 'aws s3 cp data/test-notable.txt s3://${InputBucket}/incoming/test-notable.txt'


