AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: S3-triggered notable analysis pipeline using Bedrock Claude Sonnet 4.6

Parameters:
  InputBucketName:
    Type: String
    Description: Name for the input S3 bucket (notables will be uploaded here)
    Default: notable-input-bucket
  
  OutputBucketName:
    Type: String
    Description: Name for the output S3 bucket (markdown + Bedrock JSON reports for s3 and notable_rest modes)
    Default: notable-output-bucket
  
  SplunkSinkMode:
    Type: String
    Description: Output sink mode
    Default: s3
    AllowedValues:
      - s3
      - notable_rest

  CapabilityProfiles:
    Type: String
    Description: Comma-separated capability profiles for the Lambda runtime.
    Default: core

  AllowPrivateOutboundEndpoints:
    Type: String
    Description: Explicitly allow outbound HTTPS integrations to private or local IP ranges.
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'

  HtmlReportEnabled:
    Type: String
    Description: Enables optional HTML companion reports.
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'

  RagEnabled:
    Type: String
    Description: Enables general SOC RAG retrieval from Bedrock Knowledge Bases.
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'

  RagBedrockKbId:
    Type: String
    Description: Bedrock Knowledge Base ID for general SOC advisory context. Required when RagEnabled=true.
    Default: ''

  RagMaxSnippets:
    Type: Number
    Description: Maximum Bedrock Knowledge Base snippets for general SOC RAG.
    Default: 4
    MinValue: 1
    MaxValue: 20

  RagContextBudgetChars:
    Type: Number
    Description: Character budget for rendered general SOC RAG context.
    Default: 1600
    MinValue: 1
    MaxValue: 10000

  RagFailureMode:
    Type: String
    Description: RAG failure behavior. Use suppress for default fail-soft behavior.
    Default: suppress
    AllowedValues:
      - suppress
      - fail_closed

  SplQueryRagBedrockKbId:
    Type: String
    Description: Bedrock Knowledge Base ID for SPL query grounding.
    Default: ''

  InvestigationQueryExecutor:
    Type: String
    Description: Read-only Splunk investigation executor.
    Default: rest
    AllowedValues:
      - rest
      - mcp

  SplunkSearchAllowedIndexes:
    Type: String
    Description: Comma-separated Splunk indexes allowed for read-only investigation queries.
    Default: main,notable,risk

  SplunkSearchAllowedCommands:
    Type: String
    Description: Comma-separated SPL commands allowed for read-only investigation queries.
    Default: search,stats,table,fields,where,head

  SplunkSearchDeniedCommands:
    Type: String
    Description: Comma-separated SPL commands explicitly denied for read-only investigation queries.
    Default: delete,collect,outputlookup,sendemail,map,rest,script,dbxquery,inputlookup

  SplunkSearchAllowedFields:
    Type: String
    Description: Optional comma-separated Splunk result fields retained in samples. _raw is always dropped.
    Default: ''

  SplunkSearchMaxTimeRange:
    Type: String
    Description: Maximum lookback window for one read-only Splunk investigation query.
    Default: 24h

  SplunkSearchMaxRows:
    Type: Number
    Description: Maximum rows returned by one read-only Splunk investigation query.
    Default: 100
    MinValue: 1
    MaxValue: 1000

  SplunkSearchTimeoutSeconds:
    Type: Number
    Description: Timeout in seconds for one read-only Splunk investigation query.
    Default: 30
    MinValue: 1
    MaxValue: 300

  InvestigationMaxQueriesPerAlert:
    Type: Number
    Description: Maximum read-only investigation queries per notable.
    Default: 6
    MinValue: 1
    MaxValue: 24

  InvestigationMaxConcurrentQueries:
    Type: Number
    Description: Maximum concurrent read-only investigation queries per notable.
    Default: 6
    MinValue: 1
    MaxValue: 8

  SplunkMcpEndpoint:
    Type: String
    Description: Optional HTTPS MCP bridge endpoint for read-only Splunk investigation.
    Default: ''

  SplunkMcpAuthSecretArn:
    Type: String
    Default: '*'
    AllowedPattern: '^\*$|^arn:(aws|aws-us-gov|aws-cn):secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:.+$'
    ConstraintDescription: Must be * or a valid Secrets Manager secret ARN.
    Description: Optional bearer token secret ARN for Splunk MCP-over-HTTPS.

  ServiceNowBaseUrl:
    Type: String
    Description: ServiceNow instance base URL for approved incident create.
    Default: https://your-instance.service-now.com

  ServiceNowApiTokenSecretArn:
    Type: String
    Default: '*'
    AllowedPattern: '^\*$|^arn:(aws|aws-us-gov|aws-cn):secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:.+$'
    ConstraintDescription: Must be * or a valid Secrets Manager secret ARN.
    Description: Optional ServiceNow API bearer token secret ARN.

  ServiceNowApprovalHmacSecretArn:
    Type: String
    Default: '*'
    AllowedPattern: '^\*$|^arn:(aws|aws-us-gov|aws-cn):secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:.+$'
    ConstraintDescription: Must be * or a valid Secrets Manager secret ARN.
    Description: HMAC key secret ARN used to validate ServiceNow create approvals.

  ServiceNowAssignmentGroup:
    Type: String
    Description: ServiceNow assignment group used for incident drafts.
    Default: ''

  ServiceNowTimeoutSeconds:
    Type: Number
    Description: Timeout in seconds for ServiceNow create calls.
    Default: 15
    MinValue: 1
    MaxValue: 300

  SideEffectIdempotencyTableName:
    Type: String
    Description: DynamoDB table for external side-effect idempotency markers.
    Default: notable-side-effect-idempotency

  SideEffectIdempotencyRetentionDays:
    Type: Number
    Description: Best-effort DynamoDB TTL retention for side-effect idempotency rows.
    Default: 30
    MinValue: 1
    MaxValue: 3650

  SideEffectIdempotencyLockSeconds:
    Type: Number
    Description: Stale-lock timeout for in-progress side-effect idempotency reservations.
    Default: 900
    MinValue: 1
    MaxValue: 86400

  CaseArchiveEnabled:
    Type: String
    Description: Enables S3 case envelope archiving when set directly or through analyst_portal.
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'

  CaseArchiveFailureMode:
    Type: String
    Description: Case archive failure behavior.
    Default: suppress
    AllowedValues:
      - suppress
      - fail_closed

  CaseArchiveBucketName:
    Type: String
    Description: Optional archive bucket override. Defaults to OutputBucketName when blank.
    Default: ''

  CaseArchivePrefix:
    Type: String
    Description: S3 prefix for canonical case envelopes.
    Default: cases

  CaseArchiveChunksPrefix:
    Type: String
    Description: S3 prefix for embedded case chunks.
    Default: case_chunks

  CaseEmbedLambdaName:
    Type: String
    Description: Lambda function name for post-archive case chunk embedding.
    Default: notable-case-embed

  CaseIndexTableName:
    Type: String
    Description: DynamoDB CaseIndex table name. Leave blank to avoid creating Wave 2 portal resources.
    Default: ''

  CaseRetentionDays:
    Type: Number
    Description: Retention in days for case envelopes, chunks, and index rows.
    Default: 30
    MinValue: 1
    MaxValue: 3650

  CaseSchemaVersion:
    Type: Number
    Description: Canonical case envelope schema version.
    Default: 1
    MinValue: 1
    MaxValue: 1000

  CaseAnalysisSchemaVersion:
    Type: Number
    Description: Canonical case analysis payload schema version.
    Default: 1
    MinValue: 1
    MaxValue: 1000

  CaseArchiveMaxAlertBytes:
    Type: Number
    Description: Maximum alert bytes stored in one case envelope.
    Default: 262144
    MinValue: 1
    MaxValue: 10485760

  CaseArchiveMaxAnalysisBytes:
    Type: Number
    Description: Maximum analysis bytes stored in one case envelope.
    Default: 524288
    MinValue: 1
    MaxValue: 20971520

  PortalEnabled:
    Type: String
    Description: Enables the read-only analyst portal API when set directly or through analyst_portal.
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'

  PortalApiLambdaName:
    Type: String
    Description: Lambda function name for the read-only analyst portal API.
    Default: notable-portal-api

  PortalAuthMode:
    Type: String
    Description: Portal authentication mode.
    Default: jwt
    AllowedValues:
      - jwt
      - iam

  PortalPageSize:
    Type: Number
    Description: Default case list page size.
    Default: 50
    MinValue: 1
    MaxValue: 100

  PortalMaxDetailBytes:
    Type: Number
    Description: Maximum bytes returned for case detail/raw reads.
    Default: 262144
    MinValue: 1
    MaxValue: 10485760

  PortalJwtIssuer:
    Type: String
    Description: JWT issuer required when PortalAuthMode=jwt and the portal is enabled.
    Default: ''

  PortalJwtAudience:
    Type: String
    Description: JWT audience required when PortalAuthMode=jwt and the portal is enabled.
    Default: ''

  PortalCorsAllowedOrigins:
    Type: String
    Description: Comma-separated browser origins allowed to call the portal API.
    Default: ''

  PortalChatTimeoutSec:
    Type: Number
    Description: Portal chat timeout in seconds.
    Default: 300
    MinValue: 1
    MaxValue: 900

  PortalChatFunctionUrlEnabled:
    Type: String
    Description: Enables the dedicated Function URL path for portal chat.
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'

  PortalChatMaxConcurrency:
    Type: Number
    Description: In-handler portal chat concurrency cap per Lambda execution environment.
    Default: 18
    MinValue: 1
    MaxValue: 64

  PortalChatBedrockModelId:
    Type: String
    Description: Optional Bedrock model override for portal answer synthesis.
    Default: ''

  PortalUiBucketName:
    Type: String
    Description: Optional S3 bucket name for the analyst portal static SPA. Leave blank to skip static hosting resources.
    Default: ''

  PortalUiPriceClass:
    Type: String
    Description: CloudFront price class for the analyst portal static SPA.
    Default: PriceClass_100
    AllowedValues:
      - PriceClass_100
      - PriceClass_200
      - PriceClass_All

  CaseQaEnabled:
    Type: String
    Description: Enables retrieval-bound pinned-case Q&A when set directly or through analyst_portal.
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'

  CaseQaGeneralKnowledgeEnabled:
    Type: String
    Description: Enables advisory general-knowledge fallback for Case Q&A.
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'

  CaseQaMaxIndexChunksPerCase:
    Type: Number
    Description: Maximum embedded chunks indexed for one case.
    Default: 200
    MinValue: 1
    MaxValue: 10000

  CaseQaMaxChunksPerLane:
    Type: Number
    Description: Maximum chunks returned from one retrieval lane.
    Default: 6
    MinValue: 1
    MaxValue: 50

  CaseQaMaxTotalChunks:
    Type: Number
    Description: Maximum chunks included across all retrieval lanes.
    Default: 18
    MinValue: 1
    MaxValue: 100

  CaseQaLexicalTopK:
    Type: Number
    Description: Lexical retrieval candidate count.
    Default: 30
    MinValue: 1
    MaxValue: 100

  CaseQaVectorTopK:
    Type: Number
    Description: Vector retrieval candidate count.
    Default: 30
    MinValue: 1
    MaxValue: 100

  CaseQaRrfK:
    Type: Number
    Description: Reciprocal-rank-fusion K value.
    Default: 60
    MinValue: 1
    MaxValue: 1000

  CaseQaContextBudgetChars:
    Type: Number
    Description: Character budget for Case Q&A context.
    Default: 12000
    MinValue: 1
    MaxValue: 50000

  CaseQaMaxQuestionChars:
    Type: Number
    Description: Maximum user question length for Case Q&A.
    Default: 2000
    MinValue: 1
    MaxValue: 8000

  CaseQaMaxAnswerTokens:
    Type: Number
    Description: Maximum answer tokens for portal Case Q&A synthesis.
    Default: 800
    MinValue: 1
    MaxValue: 4096

  CaseQaEmbeddingModel:
    Type: String
    Description: Embedding model used for case chunk vectors.
    Default: amazon.titan-embed-text-v2:0

  CaseQaVectorDimensions:
    Type: Number
    Description: Embedding vector dimensions. Locked to 1024 for Titan V2 in v1.
    Default: 1024
    MinValue: 1
    MaxValue: 100000

  CaseQaEmbedNormalize:
    Type: String
    Description: Normalize Case Q&A embeddings before persistence/search.
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'

  CaseQaChatHistoryEnabled:
    Type: String
    Description: Enables bounded DynamoDB-backed portal chat history.
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'

  CaseQaChatHistoryRetentionDays:
    Type: Number
    Description: Retention in days for persisted portal chat history.
    Default: 30
    MinValue: 1
    MaxValue: 3650

  CaseQaMaxSessionsPerUser:
    Type: Number
    Description: Maximum persisted chat sessions per user.
    Default: 10
    MinValue: 1
    MaxValue: 100

  CaseQaMaxMessagesPerSession:
    Type: Number
    Description: Maximum persisted messages per chat session.
    Default: 30
    MinValue: 1
    MaxValue: 200

  CaseQaMaxStoredMessageBytes:
    Type: Number
    Description: Maximum bytes stored for one chat message.
    Default: 4000
    MinValue: 1
    MaxValue: 65536

  ChatSessionsTableName:
    Type: String
    Description: DynamoDB chat sessions table required when CaseQaChatHistoryEnabled=true.
    Default: ''

  ChatMessagesTableName:
    Type: String
    Description: DynamoDB chat messages table required when CaseQaChatHistoryEnabled=true.
    Default: ''

  RagRerankEnabled:
    Type: String
    Description: Enables optional reranking for retrieval workflows.
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'

  RagRerankModel:
    Type: String
    Description: Primary rerank model ID.
    Default: cohere.rerank-v3-5:0

  RagRerankModelFallback:
    Type: String
    Description: Fallback rerank model ID for regions without the primary model.
    Default: amazon.rerank-v1:0

  ElasticsearchBaseUrl:
    Type: String
    Description: HTTPS Elasticsearch base URL for read-only investigation.
    Default: ''

  ElasticsearchApiKeySecretArn:
    Type: String
    Default: '*'
    AllowedPattern: '^\*$|^arn:(aws|aws-us-gov|aws-cn):secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:.+$'
    ConstraintDescription: Must be * or a valid Secrets Manager secret ARN.
    Description: Optional Elasticsearch API key secret ARN.

  ElasticsearchIndexAllowlist:
    Type: String
    Description: Comma-separated Elasticsearch index patterns allowed for read-only investigation.
    Default: ''

  ElasticsearchAllowWildcardIndexes:
    Type: String
    Description: Allow wildcard index patterns in Elasticsearch read-only investigation.
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'

  ElasticsearchTimestampField:
    Type: String
    Description: Timestamp field required in generated Elasticsearch range filters.
    Default: '@timestamp'

  ElasticsearchAllowedFields:
    Type: String
    Description: Comma-separated fields allowed in generated Elasticsearch queries and returned samples.
    Default: ''

  ElasticsearchMaxTimeRange:
    Type: String
    Description: Maximum time range for generated Elasticsearch queries.
    Default: 24h

  ElasticsearchMaxRows:
    Type: Number
    Description: Maximum Elasticsearch rows returned by one read-only investigation query.
    Default: 100
    MinValue: 1
    MaxValue: 1000

  ElasticsearchTimeoutSeconds:
    Type: Number
    Description: Timeout in seconds for one Elasticsearch _search call.
    Default: 30
    MinValue: 1
    MaxValue: 300

  ElasticsearchGroundingBedrockKbId:
    Type: String
    Description: Bedrock Knowledge Base ID for Elasticsearch query grounding.
    Default: ''

  SplunkBaseUrl:
    Type: String
    Default: ''
    Description: >-
      Required when SplunkSinkMode=notable_rest. Base URL for Splunk REST
      (e.g., https://splunk.example.com:8089).

  SplunkApiTokenSecretArn:
    Type: String
    Default: '*'
    AllowedPattern: '^\*$|^arn:(aws|aws-us-gov|aws-cn):secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:.+$'
    ConstraintDescription: Must be the s3-mode placeholder * or a valid Secrets Manager secret ARN for notable_rest mode.
    Description: >-
      Required when SplunkSinkMode=notable_rest. Secrets Manager ARN containing
      the Splunk API token (plain string secret or JSON object). Leave the
      default * only for s3 mode.

  SplunkApiTokenSecretField:
    Type: String
    Default: token
    Description: >-
      Optional JSON field name in SplunkApiTokenSecretArn when the secret is a
      JSON object. Ignored for plain-string secrets.

  SplunkNotableUpdatePath:
    Type: String
    Default: /services/notable_update
    Description: Optional Splunk notable update path used by notable_rest mode.

  SplunkRequirePayloadFindingId:
    Type: String
    Description: Require a payload finding_id/notable_id/sid that matches the S3 object key for Splunk writeback.
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
  
  InputRetentionDays:
    Type: Number
    Description: Number of days to retain input notables before automatic deletion
    Default: 2
    MinValue: 1
    MaxValue: 365
  
  OutputRetentionDays:
    Type: Number
    Description: Number of days to retain output reports before automatic deletion
    Default: 7
    MinValue: 1
    MaxValue: 365

  MaxDecompressedInputBytes:
    Type: Number
    Description: Maximum decompressed bytes allowed for one gzip notable input
    Default: 1048576
    MinValue: 1

  LambdaTimeoutSeconds:
    Type: Number
    Description: Lambda timeout in seconds. Keep 360 for core; use 900 as the starting point for heavier parity profiles.
    Default: 360
    MinValue: 1
    MaxValue: 900

  LambdaMemorySize:
    Type: Number
    Description: Lambda memory in MB. Keep 512 for core; use 1024 as the starting point for heavier parity profiles.
    Default: 512
    MinValue: 128
    MaxValue: 10240

  LambdaEphemeralStorageMb:
    Type: Number
    Description: Lambda ephemeral storage in MB.
    Default: 512
    MinValue: 512
    MaxValue: 10240

  LambdaReservedConcurrentExecutions:
    Type: Number
    Description: Reserved concurrency cap to limit downstream Bedrock/SIEM/Elastic fan-out.
    Default: 5
    MinValue: 1
    MaxValue: 100

  AwsAccountId:
    Type: String
    AllowedPattern: '^[0-9]{12}$'
    Description: >-
      Required. Your 12-digit AWS account ID for the Bedrock inference profile ARN
      (replace <awsaccountid> in arn:aws:bedrock:us-east-1:<awsaccountid>:inference-profile/...).
      Pass at deploy time, e.g. sam deploy --parameter-overrides AwsAccountId=...
    # Intentionally no Default: must be supplied per environment.
  
  # NOTE: This parameter is intentionally named `ImageUri` (not `ECRImageUri`) because other templates/tools
  # in this repo expect the standard `ImageUri` name for image-based SAM functions.
  ImageUri:
    Type: String
    Description: >-
      Full ECR image URI with tag for this Lambda package. The image must already exist in ECR
      before deploy (build from deploy/docker/Dockerfile or your approved base, then docker push). SAM only
      references the URI; it does not create the repository image for you.
    Default: 123456789012.dkr.ecr.us-east-1.amazonaws.com/notable-analyzer-s3:latest

Rules:
  RequireNotableRestConfig:
    RuleCondition: !Equals [!Ref SplunkSinkMode, notable_rest]
    Assertions:
      - Assert: !Not [!Equals [!Ref SplunkBaseUrl, '']]
        AssertDescription: SplunkBaseUrl is required when SplunkSinkMode=notable_rest.
      - Assert: !Not [!Equals [!Ref SplunkApiTokenSecretArn, '']]
        AssertDescription: SplunkApiTokenSecretArn is required when SplunkSinkMode=notable_rest.
      - Assert: !Not [!Equals [!Ref SplunkApiTokenSecretArn, '*']]
        AssertDescription: SplunkApiTokenSecretArn must be a real Secrets Manager ARN when SplunkSinkMode=notable_rest.

Conditions:
  IsNotableRest: !Equals [!Ref SplunkSinkMode, notable_rest]
  HasRagKnowledgeBase: !Not [!Equals [!Ref RagBedrockKbId, '']]
  HasSplQueryKnowledgeBase: !Not [!Equals [!Ref SplQueryRagBedrockKbId, '']]
  HasSplunkMcpSecret: !Not [!Equals [!Ref SplunkMcpAuthSecretArn, '*']]
  HasServiceNowSecret: !Not [!Equals [!Ref ServiceNowApiTokenSecretArn, '*']]
  HasServiceNowApprovalSecret: !Not [!Equals [!Ref ServiceNowApprovalHmacSecretArn, '*']]
  HasElasticsearchSecret: !Not [!Equals [!Ref ElasticsearchApiKeySecretArn, '*']]
  HasElasticsearchKnowledgeBase: !Not [!Equals [!Ref ElasticsearchGroundingBedrockKbId, '']]
  HasCaseArchiveBucketName: !Not [!Equals [!Ref CaseArchiveBucketName, '']]
  HasCaseIndexTable: !Not [!Equals [!Ref CaseIndexTableName, '']]
  HasPortalUiBucketName: !Not [!Equals [!Ref PortalUiBucketName, '']]
  HasPortalUiDeployment: !And [!Condition HasCaseIndexTable, !Condition HasPortalUiBucketName]
 
Resources:
  InputBucket:
    Type: AWS::S3::Bucket
    DependsOn: LambdaInvokePermission
    Properties:
      BucketName: !Ref InputBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: s3:ObjectCreated:*
            Function: !GetAtt NotableAnalyzerFunction.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: incoming/
      LifecycleConfiguration:
        Rules:
          - Id: DeleteIncomingNotablesAfterRetention
            Status: Enabled
            Prefix: incoming/
            ExpirationInDays: !Ref InputRetentionDays
  
  OutputBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref OutputBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOutputReportsAfterRetention
            Status: Enabled
            Prefix: reports/
            ExpirationInDays: !Ref OutputRetentionDays
          - !If
            - HasCaseIndexTable
            - Id: DeleteCaseArchiveAfterRetention
              Status: Enabled
              Prefix: !Sub '${CaseArchivePrefix}/'
              ExpirationInDays: !Ref CaseRetentionDays
            - !Ref AWS::NoValue
          - !If
            - HasCaseIndexTable
            - Id: DeleteCaseChunksAfterRetention
              Status: Enabled
              Prefix: !Sub '${CaseArchiveChunksPrefix}/'
              ExpirationInDays: !Ref CaseRetentionDays
            - !Ref AWS::NoValue

  SideEffectIdempotencyTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref SideEffectIdempotencyTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  CaseIndexTable:
    Type: AWS::DynamoDB::Table
    Condition: HasCaseIndexTable
    Properties:
      TableName: !Ref CaseIndexTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: case_id
          AttributeType: S
        - AttributeName: archive_partition
          AttributeType: S
        - AttributeName: processed_at_case_id
          AttributeType: S
      KeySchema:
        - AttributeName: case_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: ProcessedAtIndex
          KeySchema:
            - AttributeName: archive_partition
              KeyType: HASH
            - AttributeName: processed_at_case_id
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: expires_at_epoch
        Enabled: true
  
  NotableAnalyzerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: notable-analyzer-s3
      PackageType: Image
      Timeout: !Ref LambdaTimeoutSeconds
      MemorySize: !Ref LambdaMemorySize
      ReservedConcurrentExecutions: !Ref LambdaReservedConcurrentExecutions
      EphemeralStorage:
        Size: !Ref LambdaEphemeralStorageMb
      Environment:
        Variables:
          CAPABILITY_PROFILES: !Ref CapabilityProfiles
          ALLOW_PRIVATE_OUTBOUND_ENDPOINTS: !Ref AllowPrivateOutboundEndpoints
          HTML_REPORT_ENABLED: !Ref HtmlReportEnabled
          RAG_ENABLED: !Ref RagEnabled
          RAG_BEDROCK_KB_ID: !Ref RagBedrockKbId
          RAG_MAX_SNIPPETS: !Ref RagMaxSnippets
          RAG_CONTEXT_BUDGET_CHARS: !Ref RagContextBudgetChars
          RAG_FAILURE_MODE: !Ref RagFailureMode
          BEDROCK_MODEL_ID: !Sub 'arn:aws:bedrock:us-east-1:${AwsAccountId}:inference-profile/us.anthropic.claude-sonnet-4-6'
          SPLUNK_SINK_MODE: !Ref SplunkSinkMode
          SPLUNK_BASE_URL: !Ref SplunkBaseUrl
          SPLUNK_API_TOKEN_SECRET_ARN: !Ref SplunkApiTokenSecretArn
          SPLUNK_API_TOKEN_SECRET_FIELD: !Ref SplunkApiTokenSecretField
          SPLUNK_NOTABLE_UPDATE_PATH: !Ref SplunkNotableUpdatePath
          SPLUNK_REQUIRE_PAYLOAD_FINDING_ID: !Ref SplunkRequirePayloadFindingId
          SPL_QUERY_RAG_ENABLED: !If [HasSplQueryKnowledgeBase, 'true', 'false']
          SPL_QUERY_RAG_BEDROCK_KB_ID: !Ref SplQueryRagBedrockKbId
          INVESTIGATION_QUERY_EXECUTOR: !Ref InvestigationQueryExecutor
          INVESTIGATION_MAX_QUERIES_PER_ALERT: !Ref InvestigationMaxQueriesPerAlert
          INVESTIGATION_MAX_CONCURRENT_QUERIES: !Ref InvestigationMaxConcurrentQueries
          SPLUNK_SEARCH_ALLOWED_INDEXES: !Ref SplunkSearchAllowedIndexes
          SPLUNK_SEARCH_ALLOWED_COMMANDS: !Ref SplunkSearchAllowedCommands
          SPLUNK_SEARCH_DENIED_COMMANDS: !Ref SplunkSearchDeniedCommands
          SPLUNK_SEARCH_ALLOWED_FIELDS: !Ref SplunkSearchAllowedFields
          SPLUNK_SEARCH_MAX_TIME_RANGE: !Ref SplunkSearchMaxTimeRange
          SPLUNK_SEARCH_MAX_ROWS: !Ref SplunkSearchMaxRows
          SPLUNK_SEARCH_TIMEOUT_SECONDS: !Ref SplunkSearchTimeoutSeconds
          SPLUNK_MCP_ENDPOINT: !Ref SplunkMcpEndpoint
          SPLUNK_MCP_AUTH_SECRET_ARN: !Ref SplunkMcpAuthSecretArn
          SERVICENOW_BASE_URL: !Ref ServiceNowBaseUrl
          SERVICENOW_API_TOKEN_SECRET_ARN: !Ref ServiceNowApiTokenSecretArn
          SERVICENOW_APPROVAL_HMAC_SECRET_ARN: !Ref ServiceNowApprovalHmacSecretArn
          SERVICENOW_ASSIGNMENT_GROUP: !Ref ServiceNowAssignmentGroup
          SERVICENOW_TIMEOUT_SECONDS: !Ref ServiceNowTimeoutSeconds
          SIDE_EFFECT_IDEMPOTENCY_TABLE: !Ref SideEffectIdempotencyTableName
          SIDE_EFFECT_IDEMPOTENCY_RETENTION_DAYS: !Ref SideEffectIdempotencyRetentionDays
          SIDE_EFFECT_IDEMPOTENCY_LOCK_SECONDS: !Ref SideEffectIdempotencyLockSeconds
          CASE_ARCHIVE_ENABLED: !Ref CaseArchiveEnabled
          CASE_ARCHIVE_FAILURE_MODE: !Ref CaseArchiveFailureMode
          CASE_ARCHIVE_BUCKET: !If [HasCaseArchiveBucketName, !Ref CaseArchiveBucketName, !Ref OutputBucketName]
          CASE_ARCHIVE_PREFIX: !Ref CaseArchivePrefix
          CASE_ARCHIVE_CHUNKS_PREFIX: !Ref CaseArchiveChunksPrefix
          CASE_EMBED_LAMBDA_NAME: !If [HasCaseIndexTable, !Ref CaseEmbedFunction, '']
          CASE_INDEX_TABLE: !Ref CaseIndexTableName
          CASE_RETENTION_DAYS: !Ref CaseRetentionDays
          CASE_SCHEMA_VERSION: !Ref CaseSchemaVersion
          CASE_ANALYSIS_SCHEMA_VERSION: !Ref CaseAnalysisSchemaVersion
          CASE_ARCHIVE_MAX_ALERT_BYTES: !Ref CaseArchiveMaxAlertBytes
          CASE_ARCHIVE_MAX_ANALYSIS_BYTES: !Ref CaseArchiveMaxAnalysisBytes
          PORTAL_ENABLED: !Ref PortalEnabled
          PORTAL_AUTH_MODE: !Ref PortalAuthMode
          PORTAL_PAGE_SIZE: !Ref PortalPageSize
          PORTAL_MAX_DETAIL_BYTES: !Ref PortalMaxDetailBytes
          PORTAL_JWT_ISSUER: !Ref PortalJwtIssuer
          PORTAL_JWT_AUDIENCE: !Ref PortalJwtAudience
          PORTAL_CORS_ALLOWED_ORIGINS: !Ref PortalCorsAllowedOrigins
          PORTAL_CHAT_TIMEOUT_SEC: !Ref PortalChatTimeoutSec
          PORTAL_CHAT_FUNCTION_URL_ENABLED: !Ref PortalChatFunctionUrlEnabled
          PORTAL_CHAT_MAX_CONCURRENCY: !Ref PortalChatMaxConcurrency
          PORTAL_CHAT_BEDROCK_MODEL_ID: !Ref PortalChatBedrockModelId
          CASE_QA_ENABLED: !Ref CaseQaEnabled
          CASE_QA_GENERAL_KNOWLEDGE_ENABLED: !Ref CaseQaGeneralKnowledgeEnabled
          CASE_QA_MAX_INDEX_CHUNKS_PER_CASE: !Ref CaseQaMaxIndexChunksPerCase
          CASE_QA_MAX_CHUNKS_PER_LANE: !Ref CaseQaMaxChunksPerLane
          CASE_QA_MAX_TOTAL_CHUNKS: !Ref CaseQaMaxTotalChunks
          CASE_QA_LEXICAL_TOP_K: !Ref CaseQaLexicalTopK
          CASE_QA_VECTOR_TOP_K: !Ref CaseQaVectorTopK
          CASE_QA_RRF_K: !Ref CaseQaRrfK
          CASE_QA_CONTEXT_BUDGET_CHARS: !Ref CaseQaContextBudgetChars
          CASE_QA_MAX_QUESTION_CHARS: !Ref CaseQaMaxQuestionChars
          CASE_QA_MAX_ANSWER_TOKENS: !Ref CaseQaMaxAnswerTokens
          CASE_QA_EMBEDDING_MODEL: !Ref CaseQaEmbeddingModel
          CASE_QA_VECTOR_DIMENSIONS: !Ref CaseQaVectorDimensions
          CASE_QA_EMBED_NORMALIZE: !Ref CaseQaEmbedNormalize
          CASE_QA_CHAT_HISTORY_ENABLED: !Ref CaseQaChatHistoryEnabled
          CASE_QA_CHAT_HISTORY_RETENTION_DAYS: !Ref CaseQaChatHistoryRetentionDays
          CASE_QA_MAX_SESSIONS_PER_USER: !Ref CaseQaMaxSessionsPerUser
          CASE_QA_MAX_MESSAGES_PER_SESSION: !Ref CaseQaMaxMessagesPerSession
          CASE_QA_MAX_STORED_MESSAGE_BYTES: !Ref CaseQaMaxStoredMessageBytes
          CHAT_SESSIONS_TABLE: !Ref ChatSessionsTableName
          CHAT_MESSAGES_TABLE: !Ref ChatMessagesTableName
          RAG_RERANK_ENABLED: !Ref RagRerankEnabled
          RAG_RERANK_MODEL: !Ref RagRerankModel
          RAG_RERANK_MODEL_FALLBACK: !Ref RagRerankModelFallback
          ELASTICSEARCH_BASE_URL: !Ref ElasticsearchBaseUrl
          ELASTICSEARCH_API_KEY_SECRET_ARN: !Ref ElasticsearchApiKeySecretArn
          ELASTICSEARCH_INDEX_ALLOWLIST: !Ref ElasticsearchIndexAllowlist
          ELASTICSEARCH_ALLOW_WILDCARD_INDEXES: !Ref ElasticsearchAllowWildcardIndexes
          ELASTICSEARCH_TIMESTAMP_FIELD: !Ref ElasticsearchTimestampField
          ELASTICSEARCH_ALLOWED_FIELDS: !Ref ElasticsearchAllowedFields
          ELASTICSEARCH_MAX_TIME_RANGE: !Ref ElasticsearchMaxTimeRange
          ELASTICSEARCH_MAX_ROWS: !Ref ElasticsearchMaxRows
          ELASTICSEARCH_TIMEOUT_SECONDS: !Ref ElasticsearchTimeoutSeconds
          ELASTICSEARCH_GROUNDING_ENABLED: !If [HasElasticsearchKnowledgeBase, 'true', 'false']
          ELASTICSEARCH_GROUNDING_BEDROCK_KB_ID: !Ref ElasticsearchGroundingBedrockKbId
          INPUT_BUCKET_NAME: !Ref InputBucketName
          OUTPUT_BUCKET_NAME: !Ref OutputBucketName
          OUTPUT_PREFIX: reports
          MAX_DECOMPRESSED_INPUT_BYTES: !Ref MaxDecompressedInputBytes
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref InputBucketName
        - S3WritePolicy:
            BucketName: !Ref OutputBucketName
        - !If
          - HasCaseArchiveBucketName
          - Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource:
                  - !Sub 'arn:aws:s3:::${CaseArchiveBucketName}/${CaseArchivePrefix}/*'
          - !Ref AWS::NoValue
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - !Sub 'arn:aws:bedrock:us-east-1:${AwsAccountId}:inference-profile/us.anthropic.claude-sonnet-4-6'
        - !If
          - HasRagKnowledgeBase
          - Statement:
              - Effect: Allow
                Action:
                  - bedrock:Retrieve
                Resource:
                  - !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/${RagBedrockKbId}'
          - !Ref AWS::NoValue
        - !If
          - HasSplQueryKnowledgeBase
          - Statement:
              - Effect: Allow
                Action:
                  - bedrock:Retrieve
                Resource:
                  - !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/${SplQueryRagBedrockKbId}'
          - !Ref AWS::NoValue
        - !If
          - IsNotableRest
          - Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Ref SplunkApiTokenSecretArn
          - !Ref AWS::NoValue
        - !If
          - HasSplunkMcpSecret
          - Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Ref SplunkMcpAuthSecretArn
          - !Ref AWS::NoValue
        - !If
          - HasServiceNowSecret
          - Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Ref ServiceNowApiTokenSecretArn
          - !Ref AWS::NoValue
        - !If
          - HasServiceNowApprovalSecret
          - Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Ref ServiceNowApprovalHmacSecretArn
          - !Ref AWS::NoValue
        - !If
          - HasElasticsearchKnowledgeBase
          - Statement:
              - Effect: Allow
                Action:
                  - bedrock:Retrieve
                Resource:
                  - !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/${ElasticsearchGroundingBedrockKbId}'
          - !Ref AWS::NoValue
        - !If
          - HasElasticsearchSecret
          - Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Ref ElasticsearchApiKeySecretArn
          - !Ref AWS::NoValue
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:GetItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
              Resource: !GetAtt SideEffectIdempotencyTable.Arn
        - !If
          - HasCaseIndexTable
          - Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource:
                  - !GetAtt CaseIndexTable.Arn
          - !Ref AWS::NoValue
        - !If
          - HasCaseIndexTable
          - Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !GetAtt CaseEmbedFunction.Arn
          - !Ref AWS::NoValue
        - Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/notable-analyzer-s3:*'
      ImageUri: !Ref ImageUri

  CaseEmbedFunction:
    Type: AWS::Serverless::Function
    Condition: HasCaseIndexTable
    Properties:
      FunctionName: !Ref CaseEmbedLambdaName
      PackageType: Image
      Timeout: 900
      MemorySize: !Ref LambdaMemorySize
      EphemeralStorage:
        Size: !Ref LambdaEphemeralStorageMb
      ImageConfig:
        Command:
          - s3_notable_pipeline.embed_handler.handler
      Environment:
        Variables:
          CAPABILITY_PROFILES: core
          CASE_ARCHIVE_BUCKET: !If [HasCaseArchiveBucketName, !Ref CaseArchiveBucketName, !Ref OutputBucketName]
          CASE_ARCHIVE_CHUNKS_PREFIX: !Ref CaseArchiveChunksPrefix
          CASE_INDEX_TABLE: !Ref CaseIndexTableName
          CASE_QA_MAX_INDEX_CHUNKS_PER_CASE: !Ref CaseQaMaxIndexChunksPerCase
          CASE_QA_EMBEDDING_MODEL: !Ref CaseQaEmbeddingModel
          CASE_QA_VECTOR_DIMENSIONS: !Ref CaseQaVectorDimensions
          CASE_QA_EMBED_NORMALIZE: !Ref CaseQaEmbedNormalize
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
                - s3:DeleteObject
                - s3:ListBucket
              Resource:
                - !Sub 'arn:aws:s3:::${OutputBucketName}'
                - !Sub 'arn:aws:s3:::${OutputBucketName}/${CaseArchivePrefix}/*'
                - !Sub 'arn:aws:s3:::${OutputBucketName}/${CaseArchiveChunksPrefix}/*'
        - !If
          - HasCaseArchiveBucketName
          - Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !Sub 'arn:aws:s3:::${CaseArchiveBucketName}'
                  - !Sub 'arn:aws:s3:::${CaseArchiveBucketName}/${CaseArchivePrefix}/*'
                  - !Sub 'arn:aws:s3:::${CaseArchiveBucketName}/${CaseArchiveChunksPrefix}/*'
          - !Ref AWS::NoValue
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:UpdateItem
              Resource:
                - !GetAtt CaseIndexTable.Arn
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${CaseQaEmbeddingModel}'
        - Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${CaseEmbedLambdaName}:*'
      ImageUri: !Ref ImageUri

  PortalApiFunction:
    Type: AWS::Serverless::Function
    Condition: HasCaseIndexTable
    Properties:
      FunctionName: !Ref PortalApiLambdaName
      PackageType: Image
      Timeout: !Ref PortalChatTimeoutSec
      MemorySize: !Ref LambdaMemorySize
      EphemeralStorage:
        Size: !Ref LambdaEphemeralStorageMb
      ImageConfig:
        Command:
          - s3_notable_pipeline.portal_handler.handler
      Environment:
        Variables:
          CAPABILITY_PROFILES: !Ref CapabilityProfiles
          BEDROCK_MODEL_ID: !Sub 'arn:aws:bedrock:us-east-1:${AwsAccountId}:inference-profile/us.anthropic.claude-sonnet-4-6'
          CASE_ARCHIVE_BUCKET: !If [HasCaseArchiveBucketName, !Ref CaseArchiveBucketName, !Ref OutputBucketName]
          CASE_ARCHIVE_CHUNKS_PREFIX: !Ref CaseArchiveChunksPrefix
          CASE_EMBED_LAMBDA_NAME: !If [HasCaseIndexTable, !Ref CaseEmbedFunction, '']
          CASE_INDEX_TABLE: !Ref CaseIndexTableName
          CASE_RETENTION_DAYS: !Ref CaseRetentionDays
          PORTAL_ENABLED: !Ref PortalEnabled
          PORTAL_AUTH_MODE: !Ref PortalAuthMode
          PORTAL_PAGE_SIZE: !Ref PortalPageSize
          PORTAL_MAX_DETAIL_BYTES: !Ref PortalMaxDetailBytes
          PORTAL_JWT_ISSUER: !Ref PortalJwtIssuer
          PORTAL_JWT_AUDIENCE: !Ref PortalJwtAudience
          PORTAL_CORS_ALLOWED_ORIGINS: !Ref PortalCorsAllowedOrigins
          PORTAL_CHAT_TIMEOUT_SEC: !Ref PortalChatTimeoutSec
          PORTAL_CHAT_MAX_CONCURRENCY: !Ref PortalChatMaxConcurrency
          PORTAL_CHAT_BEDROCK_MODEL_ID: !Ref PortalChatBedrockModelId
          CASE_QA_ENABLED: !Ref CaseQaEnabled
          CASE_QA_GENERAL_KNOWLEDGE_ENABLED: !Ref CaseQaGeneralKnowledgeEnabled
          CASE_QA_MAX_QUESTION_CHARS: !Ref CaseQaMaxQuestionChars
          CASE_QA_MAX_ANSWER_TOKENS: !Ref CaseQaMaxAnswerTokens
          CASE_QA_CHAT_HISTORY_ENABLED: !Ref CaseQaChatHistoryEnabled
          CASE_QA_MAX_SESSIONS_PER_USER: !Ref CaseQaMaxSessionsPerUser
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:GetItem
                - dynamodb:DescribeTable
              Resource:
                - !GetAtt CaseIndexTable.Arn
                - !Sub '${CaseIndexTable.Arn}/index/ProcessedAtIndex'
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource:
                - !Sub 'arn:aws:s3:::${OutputBucketName}/${CaseArchivePrefix}/*'
                - !Sub 'arn:aws:s3:::${OutputBucketName}/${CaseArchiveChunksPrefix}/*'
                - !Sub 'arn:aws:s3:::${OutputBucketName}/reports/*'
        - !If
          - HasCaseArchiveBucketName
          - Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  - !Sub 'arn:aws:s3:::${CaseArchiveBucketName}/${CaseArchivePrefix}/*'
                  - !Sub 'arn:aws:s3:::${CaseArchiveBucketName}/${CaseArchiveChunksPrefix}/*'
          - !Ref AWS::NoValue
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - !Sub 'arn:aws:bedrock:us-east-1:${AwsAccountId}:inference-profile/us.anthropic.claude-sonnet-4-6'
        - Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${PortalApiLambdaName}:*'
      ImageUri: !Ref ImageUri
  
  PortalUiBucket:
    Type: AWS::S3::Bucket
    Condition: HasPortalUiDeployment
    Properties:
      BucketName: !Ref PortalUiBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  PortalUiOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Condition: HasPortalUiDeployment
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-portal-ui-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  PortalUiDistribution:
    Type: AWS::CloudFront::Distribution
    Condition: HasPortalUiDeployment
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub '${AWS::StackName} analyst portal UI'
        DefaultRootObject: index.html
        PriceClass: !Ref PortalUiPriceClass
        Origins:
          - Id: PortalUiS3Origin
            DomainName: !GetAtt PortalUiBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt PortalUiOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: PortalUiS3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
            - OPTIONS
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

  PortalUiBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: HasPortalUiDeployment
    Properties:
      Bucket: !Ref PortalUiBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${PortalUiBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${PortalUiDistribution}'

  LambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref NotableAnalyzerFunction
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceArn: !Sub 'arn:aws:s3:::${InputBucketName}'

Outputs:
  FunctionArn:
    Description: Lambda Function ARN
    Value: !GetAtt NotableAnalyzerFunction.Arn
  
  InputBucketName:
    Description: Input S3 bucket name
    Value: !Ref InputBucket
  
  OutputBucketName:
    Description: Output S3 bucket name
    Value: !Ref OutputBucket
  
  TestCommand:
    Description: Command to upload a test notable
    Value: !Sub 'aws s3 cp data/test-notable.txt s3://${InputBucket}/incoming/test-notable.txt'

  PortalUiBucketName:
    Condition: HasPortalUiDeployment
    Description: Analyst portal static SPA bucket name
    Value: !Ref PortalUiBucket

  PortalUiDistributionDomainName:
    Condition: HasPortalUiDeployment
    Description: CloudFront domain name for the analyst portal static SPA
    Value: !GetAtt PortalUiDistribution.DomainName

