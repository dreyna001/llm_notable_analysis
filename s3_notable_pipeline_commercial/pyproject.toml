[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "s3-notable-pipeline"
version = "0.1.0"
description = "S3-triggered notable analysis Lambda pipeline"
requires-python = ">=3.12"
dependencies = [
    "requests==2.32.5",
    "PyJWT[crypto]==2.10.1",
    "pydantic==2.13.4",
    "boto3==1.37.38",
]

[project.optional-dependencies]
test = [
    "pytest==8.4.1",
    "PyYAML==6.0.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
s3_notable_pipeline = ["enterprise_attack_v17.1_ids.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests requiring LocalStack or another local service emulator",
]
