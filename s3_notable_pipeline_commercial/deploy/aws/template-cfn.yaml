AWSTemplateFormatVersion: '2010-09-09'
Description: Commercial AWS S3 notable analysis pipeline using customer-approved Bedrock models (pure CloudFormation)
Metadata:
  cfn-lint:
    config:
      # The optional portal override ARN is empty unless its matching condition is true.
      ignore_checks:
        - W1030

Parameters:
  InputBucketName:
    Type: String
    Description: Name for the input S3 bucket (notables will be uploaded here)
    Default: notable-input-bucket

  OutputBucketName:
    Type: String
    Description: Name for the output S3 bucket (markdown + Bedrock JSON reports for s3 and notable_rest modes)
    Default: notable-output-bucket

  DeploymentPartition:
    Type: String
    Default: aws
    AllowedValues:
      - aws
    Description: CloudFormation partition for the deployment boundary.

  DeploymentRegion:
    Type: String
    Default: us-east-1
    AllowedValues:
      - us-east-1
    Description: Commercial AWS region for this deployment. Must match AWS::Region.

  EcrRepositoryUri:
    Type: String
    Description: Full customer commercial AWS ECR repository URI in us-east-1 without a tag or digest.
    AllowedPattern: '^([0-9]{12})\.dkr\.ecr\.us-east-1\.amazonaws\.com/[a-zA-Z0-9._/-]+$'

  ImageDigest:
    Type: String
    Description: Immutable Lambda image digest in sha256 format.
    AllowedPattern: '^sha256:[a-f0-9]{64}$'

  BedrockAnalysisModelId:
    Type: String
    Description: Customer-approved commercial AWS Bedrock model or inference-profile ID for analysis.
    Default: ''

  BedrockAnalysisModelArn:
    Type: String
    Description: Exact ARN corresponding to BedrockAnalysisModelId for least-privilege IAM.
    AllowedPattern: '^arn:aws:bedrock:us-east-1:([0-9]{12})?:(foundation-model|inference-profile)/.+$'

  BedrockAnalysisInferenceProfileFoundationModelArns:
    Type: CommaDelimitedList
    Description: Exact source and destination foundation-model ARNs required when BedrockAnalysisModelArn is a geographic cross-region inference profile.
    Default: ''
    AllowedPattern: '^$|^arn:aws:bedrock:[a-z0-9-]+::foundation-model/[A-Za-z0-9._:-]+$'

  SplunkSinkMode:
    Type: String
    Description: Output sink mode
    Default: s3
    AllowedValues:
      - s3
      - notable_rest

  CapabilityProfiles:
    Type: String
    Description: Comma-separated capability profiles for the Lambda runtime.
    Default: core

  AllowPrivateOutboundEndpoints:
    Type: String
    Description: Explicitly allow outbound HTTPS integrations to private or local IP ranges.
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'

  HtmlReportEnabled:
    Type: String
    Description: Enables optional HTML companion reports.
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'

  RagEnabled:
    Type: String
    Description: Enables general SOC advisory retrieval from the private OpenSearch domain.
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'

  RagMaxSnippets:
    Type: Number
    Description: Maximum OpenSearch snippets for general SOC RAG.
    Default: 4
    MinValue: 1
    MaxValue: 20

  RagContextBudgetChars:
    Type: Number
    Description: Character budget for rendered general SOC RAG context.
    Default: 1600
    MinValue: 1
    MaxValue: 10000

  RagFailureMode:
    Type: String
    Description: RAG failure behavior. Use suppress for default fail-soft behavior.
    Default: suppress
    AllowedValues:
      - suppress
      - fail_closed

  SplQueryRagEnabled:
    Type: String
    Description: Enables Splunk data-dictionary grounding from OpenSearch.
    Default: 'false'
    AllowedValues: ['true', 'false']

  InvestigationQueryExecutor:
    Type: String
    Description: Read-only Splunk investigation executor.
    Default: rest
    AllowedValues:
      - rest
      - mcp

  SplunkSearchAllowedIndexes:
    Type: String
    Description: Comma-separated Splunk indexes allowed for read-only investigation queries.
    Default: main,notable,risk

  SplunkSearchAllowedCommands:
    Type: String
    Description: Comma-separated SPL commands allowed for read-only investigation queries.
    Default: search,stats,table,fields,where,head

  SplunkSearchDeniedCommands:
    Type: String
    Description: Comma-separated SPL commands explicitly denied for read-only investigation queries.
    Default: delete,collect,outputlookup,sendemail,map,rest,script,dbxquery,inputlookup

  SplunkSearchAllowedFields:
    Type: String
    Description: Optional comma-separated Splunk result fields retained in samples. _raw is always dropped.
    Default: ''

  SplunkSearchMaxTimeRange:
    Type: String
    Description: Maximum lookback window for one read-only Splunk investigation query.
    Default: 24h

  SplunkSearchMaxRows:
    Type: Number
    Description: Maximum rows returned by one read-only Splunk investigation query.
    Default: 100
    MinValue: 1
    MaxValue: 1000

  SplunkSearchTimeoutSeconds:
    Type: Number
    Description: Timeout in seconds for one read-only Splunk investigation query.
    Default: 30
    MinValue: 1
    MaxValue: 300

  InvestigationMaxQueriesPerAlert:
    Type: Number
    Description: Maximum read-only investigation queries per notable.
    Default: 6
    MinValue: 1
    MaxValue: 24

  InvestigationMaxConcurrentQueries:
    Type: Number
    Description: Maximum concurrent read-only investigation queries per notable.
    Default: 6
    MinValue: 1
    MaxValue: 8

  SplunkMcpEndpoint:
    Type: String
    Description: Optional HTTPS MCP bridge endpoint for read-only Splunk investigation.
    Default: ''

  SplunkMcpAuthSecretArn:
    Type: String
    Default: '*'
    AllowedPattern: '^\*$|^arn:aws:secretsmanager:us-east-1:[0-9]{12}:secret:.+$'
    ConstraintDescription: Must be * or a valid Secrets Manager secret ARN.
    Description: Optional bearer token secret ARN for Splunk MCP-over-HTTPS.

  ServiceNowBaseUrl:
    Type: String
    Description: ServiceNow instance base URL for approved incident create.
    Default: https://your-instance.service-now.com

  ServiceNowApiTokenSecretArn:
    Type: String
    Default: '*'
    AllowedPattern: '^\*$|^arn:aws:secretsmanager:us-east-1:[0-9]{12}:secret:.+$'
    ConstraintDescription: Must be * or a valid Secrets Manager secret ARN.
    Description: Optional ServiceNow API bearer token secret ARN.

  ServiceNowApprovalHmacSecretArn:
    Type: String
    Default: '*'
    AllowedPattern: '^\*$|^arn:aws:secretsmanager:us-east-1:[0-9]{12}:secret:.+$'
    ConstraintDescription: Must be * or a valid Secrets Manager secret ARN.
    Description: HMAC key secret ARN used to validate ServiceNow create approvals.

  ServiceNowAssignmentGroup:
    Type: String
    Description: ServiceNow assignment group used for incident drafts.
    Default: ''

  ServiceNowTimeoutSeconds:
    Type: Number
    Description: Timeout in seconds for ServiceNow create calls.
    Default: 15
    MinValue: 1
    MaxValue: 300

  ServiceNowDispositionSyncEnabled:
    Type: String
    Description: Enables scheduled read-only ServiceNow closed disposition sync.
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'

  ServiceNowDispositionSyncTokenSecretArn:
    Type: String
    Description: Secrets Manager ARN for read-only ServiceNow disposition sync bearer token.
    Default: '*'
    AllowedPattern: '^\*$|^arn:aws:secretsmanager:us-east-1:[0-9]{12}:secret:.+$'
    ConstraintDescription: Must be * or a commercial us-east-1 Secrets Manager secret ARN.

  ServiceNowDispositionFieldMap:
    Type: String
    Description: Path to ServiceNow disposition field map JSON inside the Lambda package.
    Default: '/var/task/deploy/servicenow/disposition_field_map.example.json'

  ServiceNowDispositionCodeMap:
    Type: String
    Description: Path to ServiceNow disposition code map JSON inside the Lambda package.
    Default: '/var/task/deploy/servicenow/disposition_code_map.example.json'

  ServiceNowDispositionBackfillDays:
    Type: Number
    Description: First-run closed_at lookback window for disposition sync.
    Default: 90
    MinValue: 1
    MaxValue: 3650

  DispositionRetentionDays:
    Type: Number
    Description: Retention in days for synced ServiceNow disposition rows.
    Default: 365
    MinValue: 1
    MaxValue: 3650

  DispositionSyncLambdaName:
    Type: String
    Description: Lambda function name for ServiceNow closed disposition sync.
    Default: notable-disposition-sync

  SideEffectIdempotencyTableName:
    Type: String
    Description: DynamoDB table for external side-effect idempotency markers.
    Default: notable-side-effect-idempotency

  SideEffectIdempotencyRetentionDays:
    Type: Number
    Description: Best-effort DynamoDB TTL retention for side-effect idempotency rows.
    Default: 30
    MinValue: 1
    MaxValue: 3650

  SideEffectIdempotencyLockSeconds:
    Type: Number
    Description: Stale-lock timeout for in-progress side-effect idempotency reservations.
    Default: 900
    MinValue: 1
    MaxValue: 86400

  CaseArchiveEnabled:
    Type: String
    Description: Enables S3 case envelope archiving when set directly or through analyst_portal.
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'

  CaseArchiveFailureMode:
    Type: String
    Description: Case archive failure behavior.
    Default: suppress
    AllowedValues:
      - suppress
      - fail_closed

  CaseArchiveBucketName:
    Type: String
    Description: Optional archive bucket override. Defaults to OutputBucketName when blank.
    Default: ''

  CaseArchivePrefix:
    Type: String
    Description: S3 prefix for canonical case envelopes.
    Default: cases

  CaseArchiveChunksPrefix:
    Type: String
    Description: S3 prefix for embedded case chunks.
    Default: case_chunks

  CaseEmbedLambdaName:
    Type: String
    Description: Lambda function name for post-archive case chunk embedding.
    Default: notable-case-embed

  CaseIndexTableName:
    Type: String
    Description: DynamoDB CaseIndex table name. Leave blank to avoid creating Wave 2 portal resources.
    Default: ''

  CaseRetentionDays:
    Type: Number
    Description: Retention in days for case envelopes, chunks, and index rows.
    Default: 30
    MinValue: 1
    MaxValue: 3650

  CaseSchemaVersion:
    Type: Number
    Description: Canonical case envelope schema version.
    Default: 1
    MinValue: 1
    MaxValue: 1000

  CaseAnalysisSchemaVersion:
    Type: Number
    Description: Canonical case analysis payload schema version.
    Default: 1
    MinValue: 1
    MaxValue: 1000

  CaseArchiveMaxAlertBytes:
    Type: Number
    Description: Maximum alert bytes stored in one case envelope.
    Default: 262144
    MinValue: 1
    MaxValue: 10485760

  CaseArchiveMaxAnalysisBytes:
    Type: Number
    Description: Maximum analysis bytes stored in one case envelope.
    Default: 524288
    MinValue: 1
    MaxValue: 20971520

  PortalEnabled:
    Type: String
    Description: Enables the read-only analyst portal API when set directly or through analyst_portal.
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'

  PortalApiLambdaName:
    Type: String
    Description: Lambda function name for the read-only analyst portal API.
    Default: notable-portal-api

  PortalAuthMode:
    Type: String
    Description: Portal authentication mode.
    Default: jwt
    AllowedValues:
      - jwt
      - iam

  PortalPageSize:
    Type: Number
    Description: Default case list page size.
    Default: 50
    MinValue: 1
    MaxValue: 100

  PortalMaxDetailBytes:
    Type: Number
    Description: Maximum bytes returned for case detail/raw reads.
    Default: 262144
    MinValue: 1
    MaxValue: 10485760

  PortalJwtIssuer:
    Type: String
    Description: JWT issuer required when PortalAuthMode=jwt and the portal is enabled.
    Default: ''

  PortalJwtAudience:
    Type: String
    Description: JWT audience required when PortalAuthMode=jwt and the portal is enabled.
    Default: ''

  PortalJwtTenantId:
    Type: String
    Description: Optional Entra tenant ID (JWT tid claim) enforced when PortalAuthMode=jwt.
    Default: ''
    AllowedPattern: '^$|^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'

  PortalCorsAllowedOrigins:
    Type: String
    Description: Comma-separated browser origins allowed to call the portal API.
    Default: ''

  PortalRequiredAnalystRole:
    Type: String
    Default: ''

  PortalRequiredAnalystScope:
    Type: String
    Default: ''

  PortalChatTimeoutSec:
    Type: Number
    Description: Portal chat timeout in seconds, bounded below the HTTP API integration timeout.
    Default: 29
    MinValue: 1
    MaxValue: 29

  PortalReadinessTimeoutSeconds:
    Type: Number
    Description: Per-call timeout for portal dependency readiness probes.
    Default: 2
    MinValue: 1
    MaxValue: 10

  PortalChatMaxConcurrency:
    Type: Number
    Description: In-handler portal chat concurrency cap per Lambda execution environment.
    Default: 18
    MinValue: 1
    MaxValue: 64

  PortalChatBedrockModelId:
    Type: String
    Description: Optional Bedrock model override for portal answer synthesis.
    Default: ''

  PortalChatBedrockModelArn:
    Type: String
    Description: Exact ARN for PortalChatBedrockModelId when set; otherwise portal chat uses BedrockAnalysisModelArn.
    Default: ''
    AllowedPattern: '^$|^arn:aws:bedrock:us-east-1:([0-9]{12})?:(foundation-model|inference-profile)/.+$'

  PortalChatInferenceProfileFoundationModelArns:
    Type: CommaDelimitedList
    Description: Exact source and destination foundation-model ARNs required when PortalChatBedrockModelArn is a geographic cross-region inference profile.
    Default: ''
    AllowedPattern: '^$|^arn:aws:bedrock:[a-z0-9-]+::foundation-model/[A-Za-z0-9._:-]+$'

  PortalUiBucketName:
    Type: String
    Description: Optional S3 bucket name for the analyst portal static SPA. Leave blank to skip static hosting resources.
    Default: ''

  CaseQaEnabled:
    Type: String
    Description: Enables retrieval-bound pinned-case Q&A when set directly or through analyst_portal.
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'

  CaseQaGeneralKnowledgeEnabled:
    Type: String
    Description: Enables advisory general-knowledge fallback for Case Q&A.
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'

  CaseQaMaxIndexChunksPerCase:
    Type: Number
    Description: Maximum embedded chunks indexed for one case.
    Default: 200
    MinValue: 1
    MaxValue: 10000

  CaseQaMaxChunksPerLane:
    Type: Number
    Description: Maximum chunks returned from one retrieval lane.
    Default: 6
    MinValue: 1
    MaxValue: 50

  CaseQaMaxTotalChunks:
    Type: Number
    Description: Maximum chunks included across all retrieval lanes.
    Default: 18
    MinValue: 1
    MaxValue: 100

  CaseQaLexicalTopK:
    Type: Number
    Description: Lexical retrieval candidate count.
    Default: 30
    MinValue: 1
    MaxValue: 100

  CaseQaVectorTopK:
    Type: Number
    Description: Vector retrieval candidate count.
    Default: 30
    MinValue: 1
    MaxValue: 100

  CaseQaRrfK:
    Type: Number
    Description: Reciprocal-rank-fusion K value.
    Default: 60
    MinValue: 1
    MaxValue: 1000

  CaseQaContextBudgetChars:
    Type: Number
    Description: Character budget for Case Q&A context.
    Default: 12000
    MinValue: 1
    MaxValue: 50000

  CaseQaMaxQuestionChars:
    Type: Number
    Description: Maximum user question length for Case Q&A.
    Default: 2000
    MinValue: 1
    MaxValue: 8000

  CaseQaMaxAnswerTokens:
    Type: Number
    Description: Maximum answer tokens for portal Case Q&A synthesis.
    Default: 800
    MinValue: 1
    MaxValue: 4096

  CaseQaEmbeddingModel:
    Type: String
    Description: Embedding model used for case chunk vectors.
    Default: amazon.titan-embed-text-v2:0

  CaseQaVectorDimensions:
    Type: Number
    Description: Embedding vector dimensions. Locked to 1024 for Titan V2 in v1.
    Default: 1024
    MinValue: 1
    MaxValue: 100000

  CaseQaEmbedNormalize:
    Type: String
    Description: Normalize Case Q&A embeddings before persistence/search.
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'

  CaseQaChatHistoryEnabled:
    Type: String
    Description: Enables bounded DynamoDB-backed portal chat history.
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'

  CaseQaChatHistoryRetentionDays:
    Type: Number
    Description: Retention in days for persisted portal chat history.
    Default: 30
    MinValue: 1
    MaxValue: 3650

  CaseQaMaxSessionsPerUser:
    Type: Number
    Description: Maximum persisted chat sessions per user.
    Default: 10
    MinValue: 1
    MaxValue: 100

  CaseQaMaxMessagesPerSession:
    Type: Number
    Description: Maximum persisted messages per chat session.
    Default: 30
    MinValue: 1
    MaxValue: 200

  CaseQaMaxStoredMessageBytes:
    Type: Number
    Description: Maximum bytes stored for one chat message.
    Default: 4000
    MinValue: 1
    MaxValue: 65536

  CaseQaChatImagesEnabled:
    Type: String
    Description: Enables request-scoped portal chat image uploads when true.
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'

  CaseQaMaxChatImages:
    Type: Number
    Description: Maximum chat images accepted per portal chat request.
    Default: 1
    MinValue: 1
    MaxValue: 4

  CaseQaMaxChatImageBytes:
    Type: Number
    Description: Maximum decoded bytes per chat image.
    Default: 750000
    MinValue: 1
    MaxValue: 5000000

  CaseQaMaxChatImageDimension:
    Type: Number
    Description: Maximum width or height per chat image.
    Default: 4096
    MinValue: 1
    MaxValue: 8192

  CaseQaMaxChatImagePixels:
    Type: Number
    Description: Maximum width*height per chat image.
    Default: 16777216
    MinValue: 1
    MaxValue: 33554432

  PortalChatVisionBedrockModelId:
    Type: String
    Description: Optional Bedrock vision model override for portal chat image synthesis.
    Default: ''

  PortalChatVisionBedrockModelArn:
    Type: String
    Description: Exact ARN for PortalChatVisionBedrockModelId when set.
    Default: ''
    AllowedPattern: '^$|^arn:aws:bedrock:us-east-1:([0-9]{12})?:(foundation-model|inference-profile)/.+$'

  PortalChatVisionInferenceProfileFoundationModelArns:
    Type: CommaDelimitedList
    Description: Exact source and destination foundation-model ARNs required when PortalChatVisionBedrockModelArn is a geographic cross-region inference profile.
    Default: ''
    AllowedPattern: '^$|^arn:aws:bedrock:[a-z0-9-]+::foundation-model/[A-Za-z0-9._:-]+$'

  ChatSessionsTableName:
    Type: String
    Description: DynamoDB chat sessions table required when CaseQaChatHistoryEnabled=true.
    Default: ''

  ChatMessagesTableName:
    Type: String
    Description: DynamoDB chat messages table required when CaseQaChatHistoryEnabled=true.
    Default: ''

  RagRerankEnabled:
    Type: String
    Description: Enables optional reranking for retrieval workflows.
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'

  RagRerankModel:
    Type: String
    Description: Primary rerank model ID.
    Default: cohere.rerank-v3-5:0

  RagRerankModelFallback:
    Type: String
    Description: Fallback rerank model ID for regions without the primary model.
    Default: amazon.rerank-v1:0

  ElasticsearchBaseUrl:
    Type: String
    Description: HTTPS Elasticsearch base URL for read-only investigation.
    Default: ''

  ElasticsearchApiKeySecretArn:
    Type: String
    Default: '*'
    AllowedPattern: '^\*$|^arn:aws:secretsmanager:us-east-1:[0-9]{12}:secret:.+$'
    ConstraintDescription: Must be * or a valid Secrets Manager secret ARN.
    Description: Optional Elasticsearch API key secret ARN.

  ElasticsearchIndexAllowlist:
    Type: String
    Description: Comma-separated Elasticsearch index patterns allowed for read-only investigation.
    Default: ''

  ElasticsearchAllowWildcardIndexes:
    Type: String
    Description: Allow wildcard index patterns in Elasticsearch read-only investigation.
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'

  ElasticsearchTimestampField:
    Type: String
    Description: Timestamp field required in generated Elasticsearch range filters.
    Default: '@timestamp'

  ElasticsearchAllowedFields:
    Type: String
    Description: Comma-separated fields allowed in generated Elasticsearch queries and returned samples.
    Default: ''

  ElasticsearchMaxTimeRange:
    Type: String
    Description: Maximum time range for generated Elasticsearch queries.
    Default: 24h

  ElasticsearchMaxRows:
    Type: Number
    Description: Maximum Elasticsearch rows returned by one read-only investigation query.
    Default: 100
    MinValue: 1
    MaxValue: 1000

  ElasticsearchTimeoutSeconds:
    Type: Number
    Description: Timeout in seconds for one Elasticsearch _search call.
    Default: 30
    MinValue: 1
    MaxValue: 300

  ElasticsearchGroundingEnabled:
    Type: String
    Description: Enables Elasticsearch data-dictionary grounding from OpenSearch.
    Default: 'false'
    AllowedValues: ['true', 'false']

  SplunkBaseUrl:
    Type: String
    Default: ''
    Description: >-
      Required when SplunkSinkMode=notable_rest. Base URL for Splunk REST
      (e.g., https://splunk.example.com:8089).

  SplunkApiTokenSecretArn:
    Type: String
    Default: '*'
    AllowedPattern: '^\*$|^arn:aws:secretsmanager:us-east-1:[0-9]{12}:secret:.+$'
    ConstraintDescription: Must be the s3-mode placeholder * or a valid Secrets Manager secret ARN for notable_rest mode.
    Description: >-
      Required when SplunkSinkMode=notable_rest. Secrets Manager ARN containing
      the Splunk API token (plain string secret or JSON object). Leave the
      default * only for s3 mode.

  SplunkApiTokenSecretField:
    Type: String
    Default: token
    Description: >-
      Optional JSON field name in SplunkApiTokenSecretArn when the secret is a
      JSON object. Ignored for plain-string secrets.

  SplunkNotableUpdatePath:
    Type: String
    Default: /services/notable_update
    Description: Optional Splunk notable update path used by notable_rest mode.

  SplunkRequirePayloadFindingId:
    Type: String
    Description: Require a payload finding_id/notable_id/sid that matches the S3 object key for Splunk writeback.
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'

  InputRetentionDays:
    Type: Number
    Description: Number of days to retain input notables before automatic deletion
    Default: 2
    MinValue: 1
    MaxValue: 365

  OutputRetentionDays:
    Type: Number
    Description: Number of days to retain output reports before automatic deletion
    Default: 7
    MinValue: 1
    MaxValue: 365

  MaxDecompressedInputBytes:
    Type: Number
    Description: Maximum decompressed bytes allowed for one gzip notable input
    Default: 1048576
    MinValue: 1

  MaxCompressedInputBytes:
    Type: Number
    Description: Maximum compressed bytes read for one gzip notable input.
    Default: 2097152
    MinValue: 1
    MaxValue: 20971520

  LambdaTimeoutSeconds:
    Type: Number
    Description: Lambda timeout in seconds. Keep 360 for core; use 900 as the starting point for heavier parity profiles.
    Default: 360
    MinValue: 1
    MaxValue: 900

  LambdaMemorySize:
    Type: Number
    Description: Lambda memory in MB. Keep 512 for core; use 1024 as the starting point for heavier parity profiles.
    Default: 512
    MinValue: 128
    MaxValue: 10240

  LambdaEphemeralStorageMb:
    Type: Number
    Description: Lambda ephemeral storage in MB.
    Default: 512
    MinValue: 512
    MaxValue: 10240

  LambdaReservedConcurrentExecutions:
    Type: Number
    Description: Reserved concurrency cap to limit downstream Bedrock/SIEM/Elastic fan-out.
    Default: 5
    MinValue: 1
    MaxValue: 100

  AnalyzerQueueName:
    Type: String
    Default: notable-analyzer-queue

  AnalyzerDlqName:
    Type: String
    Default: notable-analyzer-dlq

  AnalyzerMaximumConcurrency:
    Type: Number
    Default: 5
    MinValue: 1
    MaxValue: 1000

  EmbedQueueName:
    Type: String
    Default: notable-embed-queue

  EmbedDlqName:
    Type: String
    Default: notable-embed-dlq

  EmbedMaximumConcurrency:
    Type: Number
    Default: 5
    MinValue: 1
    MaxValue: 1000

  RagIngestionEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']

  RagIngestionQueueName:
    Type: String
    Default: notable-rag-ingestion-queue

  RagIngestionDlqName:
    Type: String
    Default: notable-rag-ingestion-dlq

  RagIngestionMaximumConcurrency:
    Type: Number
    Default: 2
    MinValue: 1
    MaxValue: 1000

  RagIngestMaxDocumentBytes:
    Type: Number
    Default: 5242880
    MinValue: 1
    MaxValue: 20971520

  RagIngestMaxManifestBytes:
    Type: Number
    Default: 262144
    MinValue: 1
    MaxValue: 2097152

  RagIngestMaxDocumentsPerManifest:
    Type: Number
    Default: 100
    MinValue: 1
    MaxValue: 10000

  RagIngestMaxTotalSourceBytes:
    Type: Number
    Default: 52428800
    MinValue: 1
    MaxValue: 1073741824

  RagIngestMaxEmbeddingsPerManifest:
    Type: Number
    Default: 2000
    MinValue: 1
    MaxValue: 100000

  RagIngestionLambdaName:
    Type: String
    Default: notable-rag-ingestion

  RagSourceBucketName:
    Type: String
    Default: ''
    Description: Existing source bucket. When set, configure its manifest notifications to the RagIngestionQueueArn output.

  RagSourcePrefix:
    Type: String
    Default: rag-sources/

  RagManifestPrefix:
    Type: String
    Default: rag-sources/manifests/
    Description: Prefix whose versioned manifest objects publish ingestion jobs.

  OpenSearchEndpoint:
    Type: String
    Default: ''

  OpenSearchRegion:
    Type: String
    Default: us-east-1
    AllowedValues:
      - us-east-1

  OpenSearchService:
    Type: String
    Default: es

  OpenSearchCaseIndex:
    Type: String
    Default: case_chunks

  OpenSearchSocIndex:
    Type: String
    Default: soc_knowledge

  OpenSearchSplunkIndex:
    Type: String
    Default: splunk_dictionary

  OpenSearchElasticIndex:
    Type: String
    Default: elastic_dictionary

  OpenSearchClosedTicketIndex:
    Type: String
    Default: closed_tickets

  ClosedTicketRagEnabled:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'

  OpenSearchDomainArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:aws:es:us-east-1:[0-9]{12}:domain/.+$'
    Description: ARN of the customer-managed VPC-only OpenSearch domain.

  RagTenantId:
    Type: String
    Default: ''
    Description: Customer deployment or tenant identifier applied to every OpenSearch document and query.

  CustomerVpcSubnetIds:
    Type: String
    Default: ''
    Description: Comma-separated private subnet IDs for Lambda VpcConfig.

  CustomerSecurityGroupIds:
    Type: String
    Default: ''
    Description: Comma-separated security group IDs for Lambda VpcConfig.

  CustomerKmsKeyArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:aws:kms:us-east-1:[0-9]{12}:key/[a-f0-9-]+$'
    Description: Optional customer-managed CMK ARN for supported data-plane resources.

  CustomerKmsKeyAdminRoleArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:aws:iam::[0-9]{12}:role/.+$'
    Description: Optional customer key-administration role ARN for deployment records and key policy alignment.

  LogRetentionDays:
    Type: Number
    Default: 30
    MinValue: 1
    MaxValue: 3653

  QueueVisibilityTimeoutSeconds:
    Type: Number
    Default: 960
    MinValue: 1
    MaxValue: 43200

  QueueMessageRetentionSeconds:
    Type: Number
    Default: 345600
    MinValue: 60
    MaxValue: 1209600

  DlqMessageRetentionSeconds:
    Type: Number
    Default: 1209600
    MinValue: 60
    MaxValue: 1209600

  AlarmNotificationTopicArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:aws:sns:us-east-1:[0-9]{12}:.+$'

  PortalApiThrottleBurstLimit:
    Type: Number
    Default: 50
    MinValue: 1
    MaxValue: 10000

  PortalApiThrottleRateLimit:
    Type: Number
    Default: 100
    MinValue: 1
    MaxValue: 10000

  AwsAccountId:
    Type: String
    AllowedPattern: '^[0-9]{12}$'
    Description: >-
      Customer account identifier retained for deployment validation and model access checks.

Rules:
  RequireDistinctExternalRagSourceBucket:
    Assertions:
      - Assert: !Or
          - !Equals [!Ref RagSourceBucketName, '']
          - !Not [!Equals [!Ref RagSourceBucketName, !Ref InputBucketName]]
        AssertDescription: Leave RagSourceBucketName blank to use the input bucket; an external source must have a distinct name.
  RequireNotableRestConfig:
    RuleCondition: !Equals [!Ref SplunkSinkMode, notable_rest]
    Assertions:
      - Assert: !Not [!Equals [!Ref SplunkBaseUrl, '']]
        AssertDescription: SplunkBaseUrl is required when SplunkSinkMode=notable_rest.
      - Assert: !Not [!Equals [!Ref SplunkApiTokenSecretArn, '']]
        AssertDescription: SplunkApiTokenSecretArn is required when SplunkSinkMode=notable_rest.
      - Assert: !Not [!Equals [!Ref SplunkApiTokenSecretArn, '*']]
        AssertDescription: SplunkApiTokenSecretArn must be a real Secrets Manager ARN when SplunkSinkMode=notable_rest.
  RequireCommercialAwsBoundary:
    Assertions:
      - Assert: !Equals [!Ref DeploymentPartition, !Ref AWS::Partition]
        AssertDescription: DeploymentPartition must match the CloudFormation partition.
      - Assert: !Equals [!Ref DeploymentRegion, !Ref AWS::Region]
        AssertDescription: DeploymentRegion must match AWS::Region and be us-east-1.
      - Assert: !Equals [!Ref AwsAccountId, !Ref AWS::AccountId]
        AssertDescription: AwsAccountId must match the deployment account.
      - Assert: !Not [!Equals [!Ref BedrockAnalysisModelId, '']]
        AssertDescription: BedrockAnalysisModelId must be selected for the customer deployment.
      - Assert: !Not [!Equals [!Ref BedrockAnalysisModelArn, '']]
        AssertDescription: BedrockAnalysisModelArn is required for least-privilege model invocation.
  RequireOpenSearchForVectorCapabilities:
    RuleCondition: !Or
      - !Equals [!Ref RagEnabled, 'true']
      - !Equals [!Ref SplQueryRagEnabled, 'true']
      - !Equals [!Ref ElasticsearchGroundingEnabled, 'true']
      - !Equals [!Ref CaseQaEnabled, 'true']
      - !Equals [!Ref RagIngestionEnabled, 'true']
    Assertions:
      - Assert: !Not [!Equals [!Ref OpenSearchEndpoint, '']]
        AssertDescription: OpenSearchEndpoint is required for enabled vector retrieval or ingestion.
      - Assert: !Not [!Equals [!Ref OpenSearchDomainArn, '']]
        AssertDescription: OpenSearchDomainArn is required for least-privilege data-plane IAM.
      - Assert: !Not [!Equals [!Ref RagTenantId, '']]
        AssertDescription: RagTenantId is required for tenant-scoped OpenSearch access.
      - Assert: !Not [!Equals [!Ref CustomerVpcSubnetIds, '']]
        AssertDescription: Private subnet IDs are required for the VPC-only OpenSearch path.
      - Assert: !Not [!Equals [!Ref CustomerSecurityGroupIds, '']]
        AssertDescription: Lambda security group IDs are required for the VPC-only OpenSearch path.
  RequirePortalJwtConfiguration:
    RuleCondition: !And
      - !Equals [!Ref PortalEnabled, 'true']
      - !Equals [!Ref PortalAuthMode, jwt]
    Assertions:
      - Assert: !Not [!Equals [!Ref PortalJwtIssuer, '']]
        AssertDescription: PortalJwtIssuer is required for the JWT portal.
      - Assert: !Not [!Equals [!Ref PortalJwtAudience, '']]
        AssertDescription: PortalJwtAudience is required for the JWT portal.
      - Assert: !Or
          - !Not [!Equals [!Ref PortalRequiredAnalystRole, '']]
          - !Not [!Equals [!Ref PortalRequiredAnalystScope, '']]
        AssertDescription: Set a customer analyst role or scope for the JWT portal.
  RequireCaseIndexForPortalFeatures:
    RuleCondition: !Or
      - !Equals [!Ref PortalEnabled, 'true']
      - !Equals [!Ref CaseQaEnabled, 'true']
    Assertions:
      - Assert: !Not [!Equals [!Ref CaseIndexTableName, '']]
        AssertDescription: CaseIndexTableName is required when portal or Case Q&A is enabled.
  RequireCaseArchiveForPortal:
    RuleCondition: !Equals [!Ref PortalEnabled, 'true']
    Assertions:
      - Assert: !Equals [!Ref CaseArchiveEnabled, 'true']
        AssertDescription: CaseArchiveEnabled must be true when PortalEnabled is true.
  RequireChatHistoryPrerequisites:
    RuleCondition: !Equals [!Ref CaseQaChatHistoryEnabled, 'true']
    Assertions:
      - Assert: !Equals [!Ref PortalEnabled, 'true']
        AssertDescription: PortalEnabled is required when chat history is enabled.
      - Assert: !Equals [!Ref CaseQaEnabled, 'true']
        AssertDescription: CaseQaEnabled is required when chat history is enabled.
      - Assert: !Not [!Equals [!Ref CaseIndexTableName, '']]
        AssertDescription: CaseIndexTableName is required when chat history is enabled.
  RequirePortalChatBedrockModelArn:
    RuleCondition: !Not [!Equals [!Ref PortalChatBedrockModelId, '']]
    Assertions:
      - Assert: !Not [!Equals [!Ref PortalChatBedrockModelArn, '']]
        AssertDescription: PortalChatBedrockModelArn is required when PortalChatBedrockModelId is set.
  RequirePortalChatVisionBedrockModelArn:
    RuleCondition: !Not [!Equals [!Ref PortalChatVisionBedrockModelId, '']]
    Assertions:
      - Assert: !Not [!Equals [!Ref PortalChatVisionBedrockModelArn, '']]
        AssertDescription: PortalChatVisionBedrockModelArn is required when PortalChatVisionBedrockModelId is set.

Conditions:
  IsNotableRest: !Equals [!Ref SplunkSinkMode, notable_rest]
  HasSplunkMcpSecret: !Not [!Equals [!Ref SplunkMcpAuthSecretArn, '*']]
  HasServiceNowSecret: !Not [!Equals [!Ref ServiceNowApiTokenSecretArn, '*']]
  HasServiceNowApprovalSecret: !Not [!Equals [!Ref ServiceNowApprovalHmacSecretArn, '*']]
  HasServiceNowDispositionSyncSecret: !Not [!Equals [!Ref ServiceNowDispositionSyncTokenSecretArn, '*']]
  HasElasticsearchSecret: !Not [!Equals [!Ref ElasticsearchApiKeySecretArn, '*']]
  HasCaseArchiveBucketName: !Not [!Equals [!Ref CaseArchiveBucketName, '']]
  HasCaseIndexTable: !Not [!Equals [!Ref CaseIndexTableName, '']]
  HasCaseQa: !And [!Condition HasCaseIndexTable, !Equals [!Ref CaseQaEnabled, 'true']]
  HasPortal: !Equals [!Ref PortalEnabled, 'true']
  HasPortalApi: !And [!Condition HasPortal, !Condition HasCaseIndexTable]
  HasPortalUiBucketName: !Not [!Equals [!Ref PortalUiBucketName, '']]
  HasPortalUiDeployment: !And [!Condition HasPortal, !Condition HasCaseIndexTable, !Condition HasPortalUiBucketName]
  HasPortalCorsOrigins: !Not [!Equals [!Ref PortalCorsAllowedOrigins, '']]
  IsPortalIamAuth: !Equals [!Ref PortalAuthMode, iam]
  HasPortalJwtAuthorizer: !And
    - !Condition HasPortal
    - !Condition HasCaseIndexTable
    - !Equals [!Ref PortalAuthMode, jwt]
    - !Not [!Equals [!Ref PortalJwtIssuer, '']]
    - !Not [!Equals [!Ref PortalJwtAudience, '']]
  HasChatHistory: !Equals [!Ref CaseQaChatHistoryEnabled, 'true']
  HasManagedChatSessionsTable: !And
    - !Condition HasChatHistory
    - !Equals [!Ref ChatSessionsTableName, '']
  HasManagedChatMessagesTable: !And
    - !Condition HasChatHistory
    - !Equals [!Ref ChatMessagesTableName, '']
  HasCustomerVpc: !And
    - !Not [!Equals [!Ref CustomerVpcSubnetIds, '']]
    - !Not [!Equals [!Ref CustomerSecurityGroupIds, '']]
  HasCustomerKmsKey: !Not [!Equals [!Ref CustomerKmsKeyArn, '']]
  HasCustomerKmsAdminRole: !Not [!Equals [!Ref CustomerKmsKeyAdminRoleArn, '']]
  HasAlarmTopic: !Not [!Equals [!Ref AlarmNotificationTopicArn, '']]
  HasRagIngestion: !Equals [!Ref RagIngestionEnabled, 'true']
  HasRagSource: !Not [!Equals [!Ref RagSourceBucketName, '']]
  RagIngestionUsesInputBucket: !And
    - !Condition HasRagIngestion
    - !Not [!Condition HasRagSource]
  HasOpenSearch: !Not [!Equals [!Ref OpenSearchDomainArn, '']]
  HasVectorRetrieval: !And
    - !Condition HasOpenSearch
    - !Or
      - !Equals [!Ref RagEnabled, 'true']
      - !Equals [!Ref SplQueryRagEnabled, 'true']
      - !Equals [!Ref ElasticsearchGroundingEnabled, 'true']
      - !Equals [!Ref CaseQaEnabled, 'true']
  HasBedrockAnalysisInferenceProfileFoundationModels: !Not
    - !Equals [!Join [',', !Ref BedrockAnalysisInferenceProfileFoundationModelArns], '']
  HasPortalChatBedrockModelOverride: !Not [!Equals [!Ref PortalChatBedrockModelId, '']]
  HasPortalChatInferenceProfileFoundationModels: !And
    - !Condition HasPortalChatBedrockModelOverride
    - !Not [!Equals [!Join [',', !Ref PortalChatInferenceProfileFoundationModelArns], '']]
  PortalChatUsesAnalysisInferenceProfileFoundationModels: !And
    - !Not [!Condition HasPortalChatBedrockModelOverride]
    - !Condition HasBedrockAnalysisInferenceProfileFoundationModels
  HasPortalChatVisionBedrockModelOverride: !Not [!Equals [!Ref PortalChatVisionBedrockModelId, '']]
  HasPortalChatVisionInferenceProfileFoundationModels: !And
    - !Condition HasPortalChatVisionBedrockModelOverride
    - !Not [!Equals [!Join [',', !Ref PortalChatVisionInferenceProfileFoundationModelArns], '']]
  HasPortalChatVisionDifferentFromOverride: !And
    - !Condition HasPortalChatVisionBedrockModelOverride
    - !Condition HasPortalChatBedrockModelOverride
    - !Not
      - !Equals
        - !Ref PortalChatVisionBedrockModelArn
        - !Ref PortalChatBedrockModelArn
  HasPortalChatVisionDifferentFromAnalysis: !And
    - !Condition HasPortalChatVisionBedrockModelOverride
    - !Not [!Condition HasPortalChatBedrockModelOverride]
    - !Not
      - !Equals
        - !Ref PortalChatVisionBedrockModelArn
        - !Ref BedrockAnalysisModelArn
  HasPortalChatVisionBedrockModelSeparate: !Or
    - !Condition HasPortalChatVisionDifferentFromOverride
    - !Condition HasPortalChatVisionDifferentFromAnalysis

Resources:
  CustomerKmsReadPolicy:
    Type: AWS::IAM::ManagedPolicy
    Condition: HasCustomerKmsKey
    Properties:
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - kms:Decrypt
              - kms:DescribeKey
            Resource: !Ref CustomerKmsKeyArn

  CustomerKmsWritePolicy:
    Type: AWS::IAM::ManagedPolicy
    Condition: HasCustomerKmsKey
    Properties:
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - kms:Decrypt
              - kms:DescribeKey
              - kms:GenerateDataKey
            Resource: !Ref CustomerKmsKeyArn

  LambdaVpcEniPolicy:
    Type: AWS::IAM::ManagedPolicy
    Condition: HasCustomerVpc
    Properties:
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - ec2:CreateNetworkInterface
              - ec2:DescribeNetworkInterfaces
              - ec2:DeleteNetworkInterface
              - ec2:AssignPrivateIpAddresses
              - ec2:UnassignPrivateIpAddresses
            Resource: '*'

  AnalyzerDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Ref AnalyzerDlqName
      MessageRetentionPeriod: !Ref DlqMessageRetentionSeconds
      KmsMasterKeyId: !If [HasCustomerKmsKey, !Ref CustomerKmsKeyArn, !Ref AWS::NoValue]

  AnalyzerQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Ref AnalyzerQueueName
      VisibilityTimeout: !Ref QueueVisibilityTimeoutSeconds
      MessageRetentionPeriod: !Ref QueueMessageRetentionSeconds
      KmsMasterKeyId: !If [HasCustomerKmsKey, !Ref CustomerKmsKeyArn, !Ref AWS::NoValue]
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt AnalyzerDeadLetterQueue.Arn
        maxReceiveCount: 3

  AnalyzerQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref AnalyzerQueue
        - !If [HasRagIngestion, !Ref RagIngestionQueue, !Ref AWS::NoValue]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowInputBucketSend
            Effect: Allow
            Principal:
              Service: s3.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt AnalyzerQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:s3:::${InputBucketName}'
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
          - !If
            - HasRagIngestion
            - Sid: AllowRagSourceBucketSend
              Effect: Allow
              Principal:
                Service: s3.amazonaws.com
              Action: sqs:SendMessage
              Resource: !GetAtt RagIngestionQueue.Arn
              Condition:
                ArnEquals:
                  aws:SourceArn: !If
                    - HasRagSource
                    - !Sub 'arn:${AWS::Partition}:s3:::${RagSourceBucketName}'
                    - !Sub 'arn:${AWS::Partition}:s3:::${InputBucketName}'
                StringEquals:
                  aws:SourceAccount: !Ref AWS::AccountId
            - !Ref AWS::NoValue

  EmbedDeadLetterQueue:
    Type: AWS::SQS::Queue
    Condition: HasCaseQa
    Properties:
      QueueName: !Ref EmbedDlqName
      MessageRetentionPeriod: !Ref DlqMessageRetentionSeconds
      KmsMasterKeyId: !If [HasCustomerKmsKey, !Ref CustomerKmsKeyArn, !Ref AWS::NoValue]

  EmbedQueue:
    Type: AWS::SQS::Queue
    Condition: HasCaseQa
    Properties:
      QueueName: !Ref EmbedQueueName
      VisibilityTimeout: !Ref QueueVisibilityTimeoutSeconds
      MessageRetentionPeriod: !Ref QueueMessageRetentionSeconds
      KmsMasterKeyId: !If [HasCustomerKmsKey, !Ref CustomerKmsKeyArn, !Ref AWS::NoValue]
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt EmbedDeadLetterQueue.Arn
        maxReceiveCount: 3

  RagIngestionDeadLetterQueue:
    Type: AWS::SQS::Queue
    Condition: HasRagIngestion
    Properties:
      QueueName: !Ref RagIngestionDlqName
      MessageRetentionPeriod: !Ref DlqMessageRetentionSeconds
      KmsMasterKeyId: !If [HasCustomerKmsKey, !Ref CustomerKmsKeyArn, !Ref AWS::NoValue]

  RagIngestionQueue:
    Type: AWS::SQS::Queue
    Condition: HasRagIngestion
    Properties:
      QueueName: !Ref RagIngestionQueueName
      VisibilityTimeout: !Ref QueueVisibilityTimeoutSeconds
      MessageRetentionPeriod: !Ref QueueMessageRetentionSeconds
      KmsMasterKeyId: !If [HasCustomerKmsKey, !Ref CustomerKmsKeyArn, !Ref AWS::NoValue]
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt RagIngestionDeadLetterQueue.Arn
        maxReceiveCount: 3

  InputBucket:
    Type: AWS::S3::Bucket
    DependsOn:
      - AnalyzerQueuePolicy
    Properties:
      BucketName: !Ref InputBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: !If [HasCustomerKmsKey, aws:kms, AES256]
              KMSMasterKeyID: !If [HasCustomerKmsKey, !Ref CustomerKmsKeyArn, !Ref AWS::NoValue]
      VersioningConfiguration:
        Status: Enabled
      NotificationConfiguration:
        QueueConfigurations:
          - Event: s3:ObjectCreated:*
            Queue: !GetAtt AnalyzerQueue.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: incoming/
          - !If
            - RagIngestionUsesInputBucket
            - Event: s3:ObjectCreated:*
              Queue: !GetAtt RagIngestionQueue.Arn
              Filter:
                S3Key:
                  Rules:
                    - Name: prefix
                      Value: !Ref RagManifestPrefix
            - !Ref AWS::NoValue
      LifecycleConfiguration:
        Rules:
          - Id: DeleteIncomingNotablesAfterRetention
            Status: Enabled
            Prefix: incoming/
            ExpirationInDays: !Ref InputRetentionDays

  OutputBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref OutputBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: !If [HasCustomerKmsKey, aws:kms, AES256]
              KMSMasterKeyID: !If [HasCustomerKmsKey, !Ref CustomerKmsKeyArn, !Ref AWS::NoValue]
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOutputReportsAfterRetention
            Status: Enabled
            Prefix: reports/
            ExpirationInDays: !Ref OutputRetentionDays
          - !If
            - HasCaseIndexTable
            - Id: DeleteCaseArchiveAfterRetention
              Status: Enabled
              Prefix: !Sub '${CaseArchivePrefix}/'
              ExpirationInDays: !Ref CaseRetentionDays
            - !Ref AWS::NoValue
          - !If
            - HasCaseIndexTable
            - Id: DeleteCaseChunksAfterRetention
              Status: Enabled
              Prefix: !Sub '${CaseArchiveChunksPrefix}/'
              ExpirationInDays: !Ref CaseRetentionDays
            - !Ref AWS::NoValue

  SideEffectIdempotencyTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref SideEffectIdempotencyTableName
      BillingMode: PAY_PER_REQUEST
      SSESpecification: !If
        - HasCustomerKmsKey
        - SSEEnabled: true
          SSEType: KMS
          KMSMasterKeyId: !Ref CustomerKmsKeyArn
        - SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  CaseIndexTable:
    Type: AWS::DynamoDB::Table
    Condition: HasCaseIndexTable
    Properties:
      TableName: !Ref CaseIndexTableName
      BillingMode: PAY_PER_REQUEST
      SSESpecification: !If
        - HasCustomerKmsKey
        - SSEEnabled: true
          SSEType: KMS
          KMSMasterKeyId: !Ref CustomerKmsKeyArn
        - SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: case_id
          AttributeType: S
        - AttributeName: archive_partition
          AttributeType: S
        - AttributeName: processed_at_case_id
          AttributeType: S
        - AttributeName: correlation_id
          AttributeType: S
      KeySchema:
        - AttributeName: case_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: ProcessedAtIndex
          KeySchema:
            - AttributeName: archive_partition
              KeyType: HASH
            - AttributeName: processed_at_case_id
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: CorrelationIdIndex
          KeySchema:
            - AttributeName: correlation_id
              KeyType: HASH
            - AttributeName: processed_at_case_id
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: expires_at_epoch
        Enabled: true

  DispositionTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-servicenow-dispositions'
      BillingMode: PAY_PER_REQUEST
      SSESpecification: !If
        - HasCustomerKmsKey
        - SSEEnabled: true
          SSEType: KMS
          KMSMasterKeyId: !Ref CustomerKmsKeyArn
        - SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: snow_sys_id
          AttributeType: S
        - AttributeName: correlation_id
          AttributeType: S
        - AttributeName: sys_updated_on
          AttributeType: S
        - AttributeName: case_id
          AttributeType: S
      KeySchema:
        - AttributeName: snow_sys_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: CorrelationIdIndex
          KeySchema:
            - AttributeName: correlation_id
              KeyType: HASH
            - AttributeName: sys_updated_on
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: CaseIdIndex
          KeySchema:
            - AttributeName: case_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: expires_at_epoch
        Enabled: true

  DispositionSyncStateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-disposition-sync-state'
      BillingMode: PAY_PER_REQUEST
      SSESpecification: !If
        - HasCustomerKmsKey
        - SSEEnabled: true
          SSEType: KMS
          KMSMasterKeyId: !Ref CustomerKmsKeyArn
        - SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: job_name
          AttributeType: S
      KeySchema:
        - AttributeName: job_name
          KeyType: HASH

  ChatSessionsTable:
    Type: AWS::DynamoDB::Table
    Condition: HasManagedChatSessionsTable
    Properties:
      TableName: !Sub '${AWS::StackName}-chat-sessions'
      BillingMode: PAY_PER_REQUEST
      SSESpecification: !If
        - HasCustomerKmsKey
        - SSEEnabled: true
          SSEType: KMS
          KMSMasterKeyId: !Ref CustomerKmsKeyArn
        - SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: session_id
          AttributeType: S
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: updated_at_session_id
          AttributeType: S
      KeySchema:
        - AttributeName: session_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: UserUpdatedIndex
          KeySchema:
            - AttributeName: user_id
              KeyType: HASH
            - AttributeName: updated_at_session_id
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: expires_at_epoch
        Enabled: true

  ChatMessagesTable:
    Type: AWS::DynamoDB::Table
    Condition: HasManagedChatMessagesTable
    Properties:
      TableName: !Sub '${AWS::StackName}-chat-messages'
      BillingMode: PAY_PER_REQUEST
      SSESpecification: !If
        - HasCustomerKmsKey
        - SSEEnabled: true
          SSEType: KMS
          KMSMasterKeyId: !Ref CustomerKmsKeyArn
        - SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: session_id
          AttributeType: S
        - AttributeName: created_at_message_id
          AttributeType: S
      KeySchema:
        - AttributeName: session_id
          KeyType: HASH
        - AttributeName: created_at_message_id
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expires_at_epoch
        Enabled: true

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
        - !If [HasCustomerVpc, !Ref LambdaVpcEniPolicy, !Ref AWS::NoValue]
        - !If [HasCustomerKmsKey, !Ref CustomerKmsWritePolicy, !Ref AWS::NoValue]
      Policies:
        - PolicyName: S3AccessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !Sub 'arn:${AWS::Partition}:s3:::${InputBucketName}'
                  - !Sub 'arn:${AWS::Partition}:s3:::${InputBucketName}/*'
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource:
                  - !Sub 'arn:${AWS::Partition}:s3:::${OutputBucketName}/*'
              - !If
                - HasCaseArchiveBucketName
                - Effect: Allow
                  Action:
                    - s3:PutObject
                  Resource:
                    - !Sub 'arn:${AWS::Partition}:s3:::${CaseArchiveBucketName}/${CaseArchivePrefix}/*'
                - !Ref AWS::NoValue
              - !If
                - IsNotableRest
                - Effect: Allow
                  Action:
                    - secretsmanager:GetSecretValue
                  Resource:
                    - !Ref SplunkApiTokenSecretArn
                - !Ref AWS::NoValue
        - PolicyName: BedrockInvokePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource:
                  - !Ref BedrockAnalysisModelArn
              - !If
                - HasBedrockAnalysisInferenceProfileFoundationModels
                - Effect: Allow
                  Action:
                    - bedrock:InvokeModel
                  Resource: !Ref BedrockAnalysisInferenceProfileFoundationModelArns
                  Condition:
                    StringEquals:
                      bedrock:InferenceProfileArn: !Ref BedrockAnalysisModelArn
                - !Ref AWS::NoValue
              - !If
                - HasVectorRetrieval
                - Effect: Allow
                  Action:
                    - bedrock:InvokeModel
                  Resource:
                    - !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${CaseQaEmbeddingModel}'
                - !Ref AWS::NoValue
              - !If
                - HasSplunkMcpSecret
                - Effect: Allow
                  Action:
                    - secretsmanager:GetSecretValue
                  Resource:
                    - !Ref SplunkMcpAuthSecretArn
                - !Ref AWS::NoValue
              - !If
                - HasServiceNowSecret
                - Effect: Allow
                  Action:
                    - secretsmanager:GetSecretValue
                  Resource:
                    - !Ref ServiceNowApiTokenSecretArn
                - !Ref AWS::NoValue
              - !If
                - HasServiceNowApprovalSecret
                - Effect: Allow
                  Action:
                    - secretsmanager:GetSecretValue
                  Resource:
                    - !Ref ServiceNowApprovalHmacSecretArn
                - !Ref AWS::NoValue
              - !If
                - HasElasticsearchSecret
                - Effect: Allow
                  Action:
                    - secretsmanager:GetSecretValue
                  Resource:
                    - !Ref ElasticsearchApiKeySecretArn
                - !Ref AWS::NoValue
        - PolicyName: SideEffectIdempotencyPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                Resource: !GetAtt SideEffectIdempotencyTable.Arn
        - PolicyName: AnalyzerQueueConsumePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt AnalyzerQueue.Arn
        - !If
          - HasCaseIndexTable
          - PolicyName: CaseIndexWriterPolicy
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - dynamodb:PutItem
                    - dynamodb:GetItem
                    - dynamodb:UpdateItem
                  Resource: !GetAtt CaseIndexTable.Arn
          - !Ref AWS::NoValue
        - !If
          - HasCaseQa
          - PolicyName: CaseEmbedQueuePublishPolicy
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - sqs:SendMessage
                  Resource: !GetAtt EmbedQueue.Arn
          - !Ref AWS::NoValue
        - !If
          - HasOpenSearch
          - PolicyName: AnalyzerOpenSearchReadPolicy
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - es:ESHttpGet
                    - es:ESHttpPost
                  Resource: !Sub '${OpenSearchDomainArn}/*'
          - !Ref AWS::NoValue
        - PolicyName: CloudWatchLogsPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/notable-analyzer-s3:*'

