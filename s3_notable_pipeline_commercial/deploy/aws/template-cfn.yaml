  AnalyzerQueueEventSource:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt AnalyzerQueue.Arn
      FunctionName: !GetAtt NotableAnalyzerFunction.Arn
      BatchSize: 10
      FunctionResponseTypes:
        - ReportBatchItemFailures
      ScalingConfig:
        MaximumConcurrency: !Ref AnalyzerMaximumConcurrency

  CaseEmbedLambdaRole:
    Type: AWS::IAM::Role
    Condition: HasCaseQa
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
        - !If [HasCustomerVpc, !Ref LambdaVpcEniPolicy, !Ref AWS::NoValue]
        - !If [HasCustomerKmsKey, !Ref CustomerKmsWritePolicy, !Ref AWS::NoValue]
      Policies:
        - PolicyName: CaseChunkS3AccessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !Sub 'arn:${AWS::Partition}:s3:::${OutputBucketName}'
                  - !Sub 'arn:${AWS::Partition}:s3:::${OutputBucketName}/${CaseArchivePrefix}/*'
                  - !Sub 'arn:${AWS::Partition}:s3:::${OutputBucketName}/${CaseArchiveChunksPrefix}/*'
              - !If
                - HasCaseArchiveBucketName
                - Effect: Allow
                  Action:
                    - s3:GetObject
                    - s3:PutObject
                    - s3:DeleteObject
                    - s3:ListBucket
                  Resource:
                    - !Sub 'arn:${AWS::Partition}:s3:::${CaseArchiveBucketName}'
                    - !Sub 'arn:${AWS::Partition}:s3:::${CaseArchiveBucketName}/${CaseArchivePrefix}/*'
                    - !Sub 'arn:${AWS::Partition}:s3:::${CaseArchiveBucketName}/${CaseArchiveChunksPrefix}/*'
                - !Ref AWS::NoValue
        - PolicyName: CaseIndexStatusPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:UpdateItem
                Resource: !GetAtt CaseIndexTable.Arn
        - PolicyName: BedrockEmbeddingPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource: !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${CaseQaEmbeddingModel}'
        - PolicyName: EmbedQueueConsumePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt EmbedQueue.Arn
        - !If
          - HasOpenSearch
          - PolicyName: CaseEmbedOpenSearchWritePolicy
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - es:ESHttpGet
                    - es:ESHttpPost
                    - es:ESHttpPut
                    - es:ESHttpDelete
                  Resource: !Sub '${OpenSearchDomainArn}/*'
          - !Ref AWS::NoValue

  CaseEmbedFunction:
    Type: AWS::Lambda::Function
    Condition: HasCaseQa
    Properties:
      FunctionName: !Ref CaseEmbedLambdaName
      PackageType: Image
      Code:
        ImageUri: !Sub '${EcrRepositoryUri}@${ImageDigest}'
      ImageConfig:
        Command:
          - s3_notable_pipeline.embed_handler.handler
      Role: !GetAtt CaseEmbedLambdaRole.Arn
      Timeout: 900
      MemorySize: !Ref LambdaMemorySize
      EphemeralStorage:
        Size: !Ref LambdaEphemeralStorageMb
      VpcConfig: !If
        - HasCustomerVpc
        - SubnetIds: !Split [',', !Ref CustomerVpcSubnetIds]
          SecurityGroupIds: !Split [',', !Ref CustomerSecurityGroupIds]
        - !Ref AWS::NoValue
      Environment:
        Variables:
          AWS_PARTITION: !Ref DeploymentPartition
          CASE_EMBED_QUEUE_URL: !Ref EmbedQueue
          RAG_TENANT_ID: !Ref RagTenantId
          RAG_RETRIEVAL_BACKEND: opensearch
          OPENSEARCH_ENDPOINT: !Ref OpenSearchEndpoint
          OPENSEARCH_REGION: !Ref OpenSearchRegion
          OPENSEARCH_SERVICE: !Ref OpenSearchService
          OPENSEARCH_CASE_INDEX: !Ref OpenSearchCaseIndex
          CUSTOMER_KMS_KEY_ARN: !Ref CustomerKmsKeyArn
          CUSTOMER_VPC_SUBNET_IDS: !Ref CustomerVpcSubnetIds
          CUSTOMER_SECURITY_GROUP_IDS: !Ref CustomerSecurityGroupIds
          CAPABILITY_PROFILES: core
          CASE_ARCHIVE_BUCKET: !If [HasCaseArchiveBucketName, !Ref CaseArchiveBucketName, !Ref OutputBucketName]
          CASE_ARCHIVE_PREFIX: !Ref CaseArchivePrefix
          CASE_ARCHIVE_CHUNKS_PREFIX: !Ref CaseArchiveChunksPrefix
          CASE_INDEX_TABLE: !Ref CaseIndexTableName
          CASE_QA_MAX_INDEX_CHUNKS_PER_CASE: !Ref CaseQaMaxIndexChunksPerCase
          CASE_QA_EMBEDDING_MODEL: !Ref CaseQaEmbeddingModel
          CASE_QA_VECTOR_DIMENSIONS: !Ref CaseQaVectorDimensions
          CASE_QA_EMBED_NORMALIZE: !Ref CaseQaEmbedNormalize

  EmbedQueueEventSource:
    Type: AWS::Lambda::EventSourceMapping
    Condition: HasCaseQa
    Properties:
      EventSourceArn: !GetAtt EmbedQueue.Arn
      FunctionName: !GetAtt CaseEmbedFunction.Arn
      BatchSize: 5
      FunctionResponseTypes:
        - ReportBatchItemFailures
      ScalingConfig:
        MaximumConcurrency: !Ref EmbedMaximumConcurrency

  DispositionSyncLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
        - !If [HasCustomerVpc, !Ref LambdaVpcEniPolicy, !Ref AWS::NoValue]
        - !If [HasCustomerKmsKey, !Ref CustomerKmsReadPolicy, !Ref AWS::NoValue]
      Policies:
        - !If
          - HasServiceNowDispositionSyncSecret
          - PolicyName: ServiceNowDispositionSyncSecretPolicy
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - secretsmanager:GetSecretValue
                  Resource: !Ref ServiceNowDispositionSyncTokenSecretArn
          - !Ref AWS::NoValue
        - PolicyName: DispositionTablePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !GetAtt DispositionTable.Arn
                  - !Sub '${DispositionTable.Arn}/index/*'
                  - !GetAtt DispositionSyncStateTable.Arn
        - !If
          - HasCaseIndexTable
          - PolicyName: CaseIndexLinkPolicy
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - dynamodb:Query
                    - dynamodb:Scan
                  Resource:
                    - !GetAtt CaseIndexTable.Arn
                    - !Sub '${CaseIndexTable.Arn}/index/*'
          - !Ref AWS::NoValue
        - PolicyName: CaseArchiveReadForLinkPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  - !Sub 'arn:${AWS::Partition}:s3:::${OutputBucketName}/${CaseArchivePrefix}/*'
              - !If
                - HasCaseArchiveBucketName
                - Effect: Allow
                  Action:
                    - s3:GetObject
                  Resource:
                    - !Sub 'arn:${AWS::Partition}:s3:::${CaseArchiveBucketName}/${CaseArchivePrefix}/*'
                - !Ref AWS::NoValue

  RagIngestionLambdaRole:
    Type: AWS::IAM::Role
    Condition: HasRagIngestion
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
        - !If [HasCustomerVpc, !Ref LambdaVpcEniPolicy, !Ref AWS::NoValue]
        - !If [HasCustomerKmsKey, !Ref CustomerKmsReadPolicy, !Ref AWS::NoValue]
      Policies:
        - PolicyName: RagIngestionQueueConsumePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt RagIngestionQueue.Arn
        - PolicyName: RagIngestionSourceReadPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !If
                  - HasRagSource
                  - !Sub 'arn:${AWS::Partition}:s3:::${RagSourceBucketName}/${RagSourcePrefix}*'
                  - !Sub 'arn:${AWS::Partition}:s3:::${InputBucketName}/${RagSourcePrefix}*'
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !If
                  - HasRagSource
                  - !Sub 'arn:${AWS::Partition}:s3:::${RagSourceBucketName}'
                  - !Sub 'arn:${AWS::Partition}:s3:::${InputBucketName}'
                Condition:
                  StringLike:
                    s3:prefix:
                      - !Ref RagSourcePrefix
                      - !Sub '${RagSourcePrefix}*'
        - PolicyName: RagEmbeddingPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource: !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${CaseQaEmbeddingModel}'
        - !If
          - HasOpenSearch
          - PolicyName: RagOpenSearchHttpPolicy
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - es:ESHttpGet
                    - es:ESHttpPost
                    - es:ESHttpPut
                    - es:ESHttpDelete
                  Resource: !Sub '${OpenSearchDomainArn}/*'
          - !Ref AWS::NoValue

  RagIngestionFunction:
    Type: AWS::Lambda::Function
    Condition: HasRagIngestion
    Properties:
      FunctionName: !Ref RagIngestionLambdaName
      PackageType: Image
      Code:
        ImageUri: !Sub '${EcrRepositoryUri}@${ImageDigest}'
      ImageConfig:
        Command:
          - s3_notable_pipeline.rag_ingest_handler.handler
      Role: !GetAtt RagIngestionLambdaRole.Arn
      Timeout: !Ref LambdaTimeoutSeconds
      MemorySize: !Ref LambdaMemorySize
      ReservedConcurrentExecutions: !Ref RagIngestionMaximumConcurrency
      VpcConfig: !If
        - HasCustomerVpc
        - SubnetIds: !Split [',', !Ref CustomerVpcSubnetIds]
          SecurityGroupIds: !Split [',', !Ref CustomerSecurityGroupIds]
        - !Ref AWS::NoValue
      Environment:
        Variables:
          AWS_PARTITION: !Ref DeploymentPartition
          RAG_INGEST_QUEUE_URL: !Ref RagIngestionQueue
          RAG_INGEST_MAX_DOCUMENT_BYTES: !Ref RagIngestMaxDocumentBytes
          RAG_INGEST_MAX_MANIFEST_BYTES: !Ref RagIngestMaxManifestBytes
          RAG_INGEST_MAX_DOCUMENTS_PER_MANIFEST: !Ref RagIngestMaxDocumentsPerManifest
          RAG_INGEST_MAX_TOTAL_SOURCE_BYTES: !Ref RagIngestMaxTotalSourceBytes
          RAG_INGEST_MAX_EMBEDDINGS_PER_MANIFEST: !Ref RagIngestMaxEmbeddingsPerManifest
          RAG_SOURCE_BUCKET: !If [HasRagSource, !Ref RagSourceBucketName, !Ref InputBucketName]
          RAG_SOURCE_PREFIX: !Ref RagSourcePrefix
          RAG_TENANT_ID: !Ref RagTenantId
          OPENSEARCH_ENDPOINT: !Ref OpenSearchEndpoint
          OPENSEARCH_REGION: !Ref OpenSearchRegion
          OPENSEARCH_SERVICE: !Ref OpenSearchService
          OPENSEARCH_CASE_INDEX: !Ref OpenSearchCaseIndex
          OPENSEARCH_SOC_INDEX: !Ref OpenSearchSocIndex
          OPENSEARCH_SPLUNK_INDEX: !Ref OpenSearchSplunkIndex
          OPENSEARCH_ELASTIC_INDEX: !Ref OpenSearchElasticIndex
          RAG_RETRIEVAL_BACKEND: opensearch
          CASE_QA_EMBEDDING_MODEL: !Ref CaseQaEmbeddingModel
          CUSTOMER_KMS_KEY_ARN: !Ref CustomerKmsKeyArn
          CUSTOMER_VPC_SUBNET_IDS: !Ref CustomerVpcSubnetIds
          CUSTOMER_SECURITY_GROUP_IDS: !Ref CustomerSecurityGroupIds

  RagIngestionEventSource:
    Type: AWS::Lambda::EventSourceMapping
    Condition: HasRagIngestion
    Properties:
      EventSourceArn: !GetAtt RagIngestionQueue.Arn
      FunctionName: !GetAtt RagIngestionFunction.Arn
      BatchSize: 5
      FunctionResponseTypes:
        - ReportBatchItemFailures
      ScalingConfig:
        MaximumConcurrency: !Ref RagIngestionMaximumConcurrency

  DispositionSyncFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Ref DispositionSyncLambdaName
      PackageType: Image
      Code:
        ImageUri: !Sub '${EcrRepositoryUri}@${ImageDigest}'
      ImageConfig:
        Command:
          - s3_notable_pipeline.disposition_sync_handler.handler
      Role: !GetAtt DispositionSyncLambdaRole.Arn
      Timeout: 900
      MemorySize: !Ref LambdaMemorySize
      EphemeralStorage:
        Size: !Ref LambdaEphemeralStorageMb
      VpcConfig: !If
        - HasCustomerVpc
        - SubnetIds: !Split [',', !Ref CustomerVpcSubnetIds]
          SecurityGroupIds: !Split [',', !Ref CustomerSecurityGroupIds]
        - !Ref AWS::NoValue
      Environment:
        Variables:
          AWS_PARTITION: !Ref DeploymentPartition
          CUSTOMER_KMS_KEY_ARN: !Ref CustomerKmsKeyArn
          CUSTOMER_VPC_SUBNET_IDS: !Ref CustomerVpcSubnetIds
          CUSTOMER_SECURITY_GROUP_IDS: !Ref CustomerSecurityGroupIds
          CAPABILITY_PROFILES: core
          ALLOW_PRIVATE_OUTBOUND_ENDPOINTS: !Ref AllowPrivateOutboundEndpoints
          SERVICENOW_BASE_URL: !Ref ServiceNowBaseUrl
          SERVICENOW_TIMEOUT_SECONDS: !Ref ServiceNowTimeoutSeconds
          SERVICENOW_DISPOSITION_SYNC_ENABLED: !Ref ServiceNowDispositionSyncEnabled
          SERVICENOW_DISPOSITION_SYNC_TOKEN_SECRET_ARN: !Ref ServiceNowDispositionSyncTokenSecretArn
          SERVICENOW_DISPOSITION_FIELD_MAP: !Ref ServiceNowDispositionFieldMap
          SERVICENOW_DISPOSITION_CODE_MAP: !Ref ServiceNowDispositionCodeMap
          SERVICENOW_DISPOSITION_BACKFILL_DAYS: !Ref ServiceNowDispositionBackfillDays
          DISPOSITION_RETENTION_DAYS: !Ref DispositionRetentionDays
          DISPOSITION_TABLE: !Ref DispositionTable
          DISPOSITION_SYNC_STATE_TABLE: !Ref DispositionSyncStateTable
          CASE_ARCHIVE_BUCKET: !If [HasCaseArchiveBucketName, !Ref CaseArchiveBucketName, !Ref OutputBucketName]
          CASE_ARCHIVE_PREFIX: !Ref CaseArchivePrefix
          CASE_INDEX_TABLE: !Ref CaseIndexTableName

  DispositionSyncSchedule:
    Type: AWS::Events::Rule
    Properties:
      Description: Daily ServiceNow closed disposition sync
      ScheduleExpression: rate(1 day)
      State: ENABLED
      Targets:
        - Arn: !GetAtt DispositionSyncFunction.Arn
          Id: DispositionSyncTarget

  DispositionSyncSchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref DispositionSyncFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt DispositionSyncSchedule.Arn

  PortalApiLambdaRole:
    Type: AWS::IAM::Role
    Condition: HasPortalApi
    Metadata:
      cfn-lint:
        config:
          ignore_checks:
            - W3037  # Current bundled cfn-lint omits valid DynamoDB TransactWriteItems.
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
        - !If [HasCustomerVpc, !Ref LambdaVpcEniPolicy, !Ref AWS::NoValue]
        - !If [HasCustomerKmsKey, !Ref CustomerKmsReadPolicy, !Ref AWS::NoValue]
      Policies:
        - PolicyName: CaseIndexReadPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:Query
                  - dynamodb:GetItem
                  - dynamodb:DescribeTable
                Resource:
                  - !GetAtt CaseIndexTable.Arn
                  - !Sub '${CaseIndexTable.Arn}/index/ProcessedAtIndex'
        - PolicyName: CaseArchiveReadPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  - !Sub 'arn:${AWS::Partition}:s3:::${OutputBucketName}/${CaseArchivePrefix}/*'
                  - !Sub 'arn:${AWS::Partition}:s3:::${OutputBucketName}/${CaseArchiveChunksPrefix}/*'
                  - !Sub 'arn:${AWS::Partition}:s3:::${OutputBucketName}/reports/*'
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource:
                  - !Sub 'arn:${AWS::Partition}:s3:::${OutputBucketName}'
                Condition:
                  StringLike:
                    s3:prefix:
                      - !Ref CaseArchivePrefix
                      - !Sub '${CaseArchivePrefix}/*'
              - !If
                - HasCaseArchiveBucketName
                - Effect: Allow
                  Action:
                    - s3:GetObject
                  Resource:
                    - !Sub 'arn:${AWS::Partition}:s3:::${CaseArchiveBucketName}/${CaseArchivePrefix}/*'
                    - !Sub 'arn:${AWS::Partition}:s3:::${CaseArchiveBucketName}/${CaseArchiveChunksPrefix}/*'
                - !Ref AWS::NoValue
              - !If
                - HasCaseArchiveBucketName
                - Effect: Allow
                  Action:
                    - s3:ListBucket
                  Resource:
                    - !Sub 'arn:${AWS::Partition}:s3:::${CaseArchiveBucketName}'
                  Condition:
                    StringLike:
                      s3:prefix:
                        - !Ref CaseArchivePrefix
                        - !Sub '${CaseArchivePrefix}/*'
                - !Ref AWS::NoValue
        - !If
          - HasPortalUiDeployment
          - PolicyName: PortalUiReadPolicy
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - s3:GetObject
                  Resource: !Sub '${PortalUiBucket.Arn}/*'
          - !Ref AWS::NoValue
        - PolicyName: PortalBedrockPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:CountTokens
                Resource:
                  - !If
                    - HasPortalChatBedrockModelOverride
                    - !Ref PortalChatBedrockModelArn
                    - !Ref BedrockAnalysisModelArn
        - !If
          - PortalChatUsesAnalysisInferenceProfileFoundationModels
          - PolicyName: PortalAnalysisInferenceProfileFoundationModelPolicy
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - bedrock:InvokeModel
                  Resource: !Ref BedrockAnalysisInferenceProfileFoundationModelArns
                  Condition:
                    StringEquals:
                      bedrock:InferenceProfileArn: !Ref BedrockAnalysisModelArn
          - !Ref AWS::NoValue
        - !If
          - HasPortalChatInferenceProfileFoundationModels
          - PolicyName: PortalChatInferenceProfileFoundationModelPolicy
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - bedrock:InvokeModel
                  Resource: !Ref PortalChatInferenceProfileFoundationModelArns
                  Condition:
                    StringEquals:
                      bedrock:InferenceProfileArn: !Ref PortalChatBedrockModelArn
          - !Ref AWS::NoValue
        - !If
          - HasVectorRetrieval
          - PolicyName: PortalEmbeddingPolicy
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - bedrock:InvokeModel
                  Resource:
                    - !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${CaseQaEmbeddingModel}'
          - !Ref AWS::NoValue
        - !If
          - HasPortalChatVisionBedrockModelSeparate
          - PolicyName: PortalBedrockVisionPolicy
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - bedrock:InvokeModel
                    - bedrock:CountTokens
                  Resource:
                    - !Ref PortalChatVisionBedrockModelArn
          - !Ref AWS::NoValue
        - !If
          - HasPortalChatVisionInferenceProfileFoundationModels
          - PolicyName: PortalChatVisionInferenceProfileFoundationModelPolicy
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - bedrock:InvokeModel
                  Resource: !Ref PortalChatVisionInferenceProfileFoundationModelArns
                  Condition:
                    StringEquals:
                      bedrock:InferenceProfileArn: !Ref PortalChatVisionBedrockModelArn
          - !Ref AWS::NoValue
        - !If
          - HasOpenSearch
          - PolicyName: PortalOpenSearchReadPolicy
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - es:ESHttpGet
                    - es:ESHttpPost
                  Resource: !Sub '${OpenSearchDomainArn}/*'
          - !Ref AWS::NoValue
        - !If
          - HasChatHistory
          - PolicyName: PortalChatHistoryPolicy
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - dynamodb:Query
                    - dynamodb:GetItem
                    - dynamodb:DescribeTable
                    - dynamodb:PutItem
                    - dynamodb:UpdateItem
                    - dynamodb:DeleteItem
                  Resource:
                    - !If
                      - HasManagedChatSessionsTable
                      - !GetAtt ChatSessionsTable.Arn
                      - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ChatSessionsTableName}'
                    - !If
                      - HasManagedChatSessionsTable
                      - !Sub '${ChatSessionsTable.Arn}/index/*'
                      - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ChatSessionsTableName}/index/*'
                    - !If
                      - HasManagedChatMessagesTable
                      - !GetAtt ChatMessagesTable.Arn
                      - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ChatMessagesTableName}'
                - Effect: Allow
                  Action:
                    - dynamodb:TransactWriteItems
                  Resource:
                    - !If
                      - HasManagedChatSessionsTable
                      - !GetAtt ChatSessionsTable.Arn
                      - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ChatSessionsTableName}'
                    - !If
                      - HasManagedChatMessagesTable
                      - !GetAtt ChatMessagesTable.Arn
                      - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ChatMessagesTableName}'
          - !Ref AWS::NoValue

  PortalApiFunction:
    Type: AWS::Lambda::Function
    Condition: HasPortalApi
    Properties:
      FunctionName: !Ref PortalApiLambdaName
      PackageType: Image
      Code:
        ImageUri: !Sub '${EcrRepositoryUri}@${ImageDigest}'
      ImageConfig:
        Command:
          - s3_notable_pipeline.portal_handler.handler
      Role: !GetAtt PortalApiLambdaRole.Arn
      Timeout: !Ref PortalChatTimeoutSec
      MemorySize: !Ref LambdaMemorySize
      EphemeralStorage:
        Size: !Ref LambdaEphemeralStorageMb
      ReservedConcurrentExecutions: !Ref LambdaReservedConcurrentExecutions
      VpcConfig: !If
        - HasCustomerVpc
        - SubnetIds: !Split [',', !Ref CustomerVpcSubnetIds]
          SecurityGroupIds: !Split [',', !Ref CustomerSecurityGroupIds]
        - !Ref AWS::NoValue
      Environment:
        Variables:
          AWS_PARTITION: !Ref DeploymentPartition
          CUSTOMER_KMS_KEY_ARN: !Ref CustomerKmsKeyArn
          CUSTOMER_VPC_SUBNET_IDS: !Ref CustomerVpcSubnetIds
          CUSTOMER_SECURITY_GROUP_IDS: !Ref CustomerSecurityGroupIds
          CAPABILITY_PROFILES: !Ref CapabilityProfiles
          BEDROCK_MODEL_ID: !Ref BedrockAnalysisModelId
          RAG_TENANT_ID: !Ref RagTenantId
          RAG_RETRIEVAL_BACKEND: opensearch
          OPENSEARCH_ENDPOINT: !Ref OpenSearchEndpoint
          OPENSEARCH_REGION: !Ref OpenSearchRegion
          OPENSEARCH_SERVICE: !Ref OpenSearchService
          OPENSEARCH_CASE_INDEX: !Ref OpenSearchCaseIndex
          OPENSEARCH_SOC_INDEX: !Ref OpenSearchSocIndex
          OPENSEARCH_SPLUNK_INDEX: !Ref OpenSearchSplunkIndex
          OPENSEARCH_ELASTIC_INDEX: !Ref OpenSearchElasticIndex
          RAG_ENABLED: !Ref RagEnabled
          RAG_MAX_SNIPPETS: !Ref RagMaxSnippets
          RAG_CONTEXT_BUDGET_CHARS: !Ref RagContextBudgetChars
          SPL_QUERY_RAG_ENABLED: !Ref SplQueryRagEnabled
          CASE_ARCHIVE_BUCKET: !If [HasCaseArchiveBucketName, !Ref CaseArchiveBucketName, !Ref OutputBucketName]
          CASE_ARCHIVE_PREFIX: !Ref CaseArchivePrefix
          CASE_ARCHIVE_CHUNKS_PREFIX: !Ref CaseArchiveChunksPrefix
          CASE_EMBED_QUEUE_URL: !If [HasCaseQa, !Ref EmbedQueue, '']
          CASE_INDEX_TABLE: !Ref CaseIndexTableName
          CASE_RETENTION_DAYS: !Ref CaseRetentionDays
          PORTAL_ENABLED: !Ref PortalEnabled
          PORTAL_AUTH_MODE: !Ref PortalAuthMode
          PORTAL_PAGE_SIZE: !Ref PortalPageSize
          PORTAL_MAX_DETAIL_BYTES: !Ref PortalMaxDetailBytes
          PORTAL_JWT_ISSUER: !Ref PortalJwtIssuer
          PORTAL_JWT_AUDIENCE: !Ref PortalJwtAudience
          PORTAL_JWT_TENANT_ID: !Ref PortalJwtTenantId
          PORTAL_CORS_ALLOWED_ORIGINS: !Ref PortalCorsAllowedOrigins
          PORTAL_REQUIRED_ANALYST_ROLE: !Ref PortalRequiredAnalystRole
          PORTAL_REQUIRED_ANALYST_SCOPE: !Ref PortalRequiredAnalystScope
          PORTAL_UI_BUCKET: !If [HasPortalUiDeployment, !Ref PortalUiBucket, '']
          PORTAL_CHAT_TIMEOUT_SEC: !Ref PortalChatTimeoutSec
          PORTAL_READINESS_TIMEOUT_SECONDS: !Ref PortalReadinessTimeoutSeconds
          PORTAL_CHAT_MAX_CONCURRENCY: !Ref PortalChatMaxConcurrency
          PORTAL_CHAT_BEDROCK_MODEL_ID: !Ref PortalChatBedrockModelId
          PORTAL_CHAT_VISION_BEDROCK_MODEL_ID: !Ref PortalChatVisionBedrockModelId
          CASE_QA_ENABLED: !Ref CaseQaEnabled
          CASE_QA_GENERAL_KNOWLEDGE_ENABLED: !Ref CaseQaGeneralKnowledgeEnabled
          CASE_QA_MAX_QUESTION_CHARS: !Ref CaseQaMaxQuestionChars
          CASE_QA_MAX_ANSWER_TOKENS: !Ref CaseQaMaxAnswerTokens
          CASE_QA_EMBEDDING_MODEL: !Ref CaseQaEmbeddingModel
          CASE_QA_VECTOR_DIMENSIONS: !Ref CaseQaVectorDimensions
          CASE_QA_EMBED_NORMALIZE: !Ref CaseQaEmbedNormalize
          CASE_QA_CHAT_HISTORY_ENABLED: !Ref CaseQaChatHistoryEnabled
          CASE_QA_CHAT_HISTORY_RETENTION_DAYS: !Ref CaseQaChatHistoryRetentionDays
          CASE_QA_MAX_SESSIONS_PER_USER: !Ref CaseQaMaxSessionsPerUser
          CASE_QA_MAX_MESSAGES_PER_SESSION: !Ref CaseQaMaxMessagesPerSession
          CASE_QA_MAX_STORED_MESSAGE_BYTES: !Ref CaseQaMaxStoredMessageBytes
          CASE_QA_CHAT_IMAGES_ENABLED: !Ref CaseQaChatImagesEnabled
          CASE_QA_MAX_CHAT_IMAGES: !Ref CaseQaMaxChatImages
          CASE_QA_MAX_CHAT_IMAGE_BYTES: !Ref CaseQaMaxChatImageBytes
          CASE_QA_MAX_CHAT_IMAGE_DIMENSION: !Ref CaseQaMaxChatImageDimension
          CASE_QA_MAX_CHAT_IMAGE_PIXELS: !Ref CaseQaMaxChatImagePixels
          CHAT_SESSIONS_TABLE: !If
            - HasChatHistory
            - !If
              - HasManagedChatSessionsTable
              - !Ref ChatSessionsTable
              - !Ref ChatSessionsTableName
            - ''
          CHAT_MESSAGES_TABLE: !If
            - HasChatHistory
            - !If
              - HasManagedChatMessagesTable
              - !Ref ChatMessagesTable
              - !Ref ChatMessagesTableName
            - ''

  PortalHttpApi:
    Type: AWS::ApiGatewayV2::Api
    Condition: HasPortalApi
    Properties:
      Name: !Sub '${AWS::StackName}-portal-api'
      ProtocolType: HTTP
      CorsConfiguration: !If
        - HasPortalCorsOrigins
        - AllowCredentials: true
          AllowHeaders:
            - authorization
            - content-type
          AllowMethods:
            - GET
            - POST
            - DELETE
            - OPTIONS
          AllowOrigins: !Split
            - ','
            - !Ref PortalCorsAllowedOrigins
        - !Ref AWS::NoValue

  PortalHttpApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Condition: HasPortalApi
    Properties:
      ApiId: !Ref PortalHttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${PortalApiFunction.Arn}/invocations'
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 29000

  PortalHttpApiAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Condition: HasPortalJwtAuthorizer
    Properties:
      ApiId: !Ref PortalHttpApi
      AuthorizerType: JWT
      IdentitySource:
        - $request.header.Authorization
      JwtConfiguration:
        Audience:
          - !Ref PortalJwtAudience
        Issuer: !Ref PortalJwtIssuer
      Name: portal-jwt

  PortalHttpApiHealthRoute:
    Type: AWS::ApiGatewayV2::Route
    Condition: HasPortalApi
    Properties:
      ApiId: !Ref PortalHttpApi
      RouteKey: GET /health
      AuthorizationType: NONE
      Target: !Sub 'integrations/${PortalHttpApiIntegration}'

  PortalHttpApiReadyRoute:
    Type: AWS::ApiGatewayV2::Route
    Condition: HasPortalApi
    Properties:
      ApiId: !Ref PortalHttpApi
      RouteKey: GET /ready
      AuthorizationType: NONE
      Target: !Sub 'integrations/${PortalHttpApiIntegration}'

  PortalHttpApiDefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Condition: HasPortalApi
    Properties:
      ApiId: !Ref PortalHttpApi
      RouteKey: 'ANY /api/{proxy+}'
      AuthorizationType: !If [HasPortalJwtAuthorizer, JWT, !If [IsPortalIamAuth, AWS_IAM, NONE]]
      AuthorizerId: !If [HasPortalJwtAuthorizer, !Ref PortalHttpApiAuthorizer, !Ref AWS::NoValue]
      Target: !Sub 'integrations/${PortalHttpApiIntegration}'

  PortalHttpApiApiRootRoute:
    Type: AWS::ApiGatewayV2::Route
    Condition: HasPortalApi
    Properties:
      ApiId: !Ref PortalHttpApi
      RouteKey: 'ANY /api'
      AuthorizationType: !If [HasPortalJwtAuthorizer, JWT, !If [IsPortalIamAuth, AWS_IAM, NONE]]
      AuthorizerId: !If [HasPortalJwtAuthorizer, !Ref PortalHttpApiAuthorizer, !Ref AWS::NoValue]
      Target: !Sub 'integrations/${PortalHttpApiIntegration}'

  PortalHttpApiStaticRoute:
    Type: AWS::ApiGatewayV2::Route
    Condition: HasPortalUiDeployment
    Properties:
      ApiId: !Ref PortalHttpApi
      RouteKey: 'GET /{proxy+}'
      AuthorizationType: NONE
      Target: !Sub 'integrations/${PortalHttpApiIntegration}'

  PortalHttpApiStaticRootRoute:
    Type: AWS::ApiGatewayV2::Route
    Condition: HasPortalUiDeployment
    Properties:
      ApiId: !Ref PortalHttpApi
      RouteKey: 'GET /'
      AuthorizationType: NONE
      Target: !Sub 'integrations/${PortalHttpApiIntegration}'

  PortalHttpApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Condition: HasPortalApi
    Properties:
      ApiId: !Ref PortalHttpApi
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: !Ref PortalApiThrottleBurstLimit
        ThrottlingRateLimit: !Ref PortalApiThrottleRateLimit

  PortalHttpApiInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: HasPortalApi
    Properties:
      FunctionName: !Ref PortalApiFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${PortalHttpApi}/*'

  PortalUiBucket:
    Type: AWS::S3::Bucket
    Condition: HasPortalUiDeployment
    Properties:
      BucketName: !Ref PortalUiBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: !If [HasCustomerKmsKey, aws:kms, AES256]
              KMSMasterKeyID: !If [HasCustomerKmsKey, !Ref CustomerKmsKeyArn, !Ref AWS::NoValue]
      VersioningConfiguration:
        Status: Enabled

  NotableAnalyzerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/notable-analyzer-s3
      RetentionInDays: !Ref LogRetentionDays
      KmsKeyId: !If [HasCustomerKmsKey, !Ref CustomerKmsKeyArn, !Ref AWS::NoValue]

  RagIngestionLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: HasRagIngestion
    Properties:
      LogGroupName: !Sub '/aws/lambda/${RagIngestionLambdaName}'
      RetentionInDays: !Ref LogRetentionDays
      KmsKeyId: !If [HasCustomerKmsKey, !Ref CustomerKmsKeyArn, !Ref AWS::NoValue]

  CaseEmbedLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: HasCaseQa
    Properties:
      LogGroupName: !Sub '/aws/lambda/${CaseEmbedLambdaName}'
      RetentionInDays: !Ref LogRetentionDays
      KmsKeyId: !If [HasCustomerKmsKey, !Ref CustomerKmsKeyArn, !Ref AWS::NoValue]

  PortalApiLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: HasPortalApi
    Properties:
      LogGroupName: !Sub '/aws/lambda/${PortalApiLambdaName}'
      RetentionInDays: !Ref LogRetentionDays
      KmsKeyId: !If [HasCustomerKmsKey, !Ref CustomerKmsKeyArn, !Ref AWS::NoValue]

  DispositionSyncLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${DispositionSyncLambdaName}'
      RetentionInDays: !Ref LogRetentionDays
      KmsKeyId: !If [HasCustomerKmsKey, !Ref CustomerKmsKeyArn, !Ref AWS::NoValue]

  AnalyzerQueueDepthAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt AnalyzerQueue.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmNotificationTopicArn], !Ref AWS::NoValue]

  AnalyzerDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt AnalyzerDeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmNotificationTopicArn], !Ref AWS::NoValue]

  AnalyzerOldestMessageAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions:
        - Name: QueueName
          Value: !GetAtt AnalyzerQueue.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 300
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmNotificationTopicArn], !Ref AWS::NoValue]

  AnalyzerErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref NotableAnalyzerFunction
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmNotificationTopicArn], !Ref AWS::NoValue]

  EmbedDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasCaseQa
    Properties:
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt EmbedDeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmNotificationTopicArn], !Ref AWS::NoValue]

  EmbedErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasCaseQa
    Properties:
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref CaseEmbedFunction
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmNotificationTopicArn], !Ref AWS::NoValue]

  RagIngestionOldestMessageAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasRagIngestion
    Properties:
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions:
        - Name: QueueName
          Value: !GetAtt RagIngestionQueue.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 300
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmNotificationTopicArn], !Ref AWS::NoValue]

  PortalErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasPortalApi
    Properties:
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref PortalApiFunction
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmNotificationTopicArn], !Ref AWS::NoValue]

  RagIngestionDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasRagIngestion
    Properties:
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt RagIngestionDeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmNotificationTopicArn], !Ref AWS::NoValue]

  RagIngestionErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasRagIngestion
    Properties:
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref RagIngestionFunction
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmNotificationTopicArn], !Ref AWS::NoValue]

Outputs:
  CustomerKmsKeyAdminRoleArn:
    Condition: HasCustomerKmsAdminRole
    Description: Customer role recorded for KMS key-administration alignment.
    Value: !Ref CustomerKmsKeyAdminRoleArn

  FunctionArn:
    Description: Lambda Function ARN
    Value: !GetAtt NotableAnalyzerFunction.Arn

  InputBucketName:
    Description: Input S3 bucket name
    Value: !Ref InputBucket

  OutputBucketName:
    Description: Output S3 bucket name
    Value: !Ref OutputBucket

  RagIngestionQueueArn:
    Condition: HasRagIngestion
    Description: Queue ARN for RAG manifest notifications; external source buckets must notify this queue.
    Value: !GetAtt RagIngestionQueue.Arn

  TestCommand:
    Description: Command to upload a test notable
    Value: !Sub 'aws s3 cp data/test-notable.txt s3://${InputBucket}/incoming/test-notable.txt'

  PortalUiBucketName:
    Condition: HasPortalUiDeployment
    Description: Analyst portal static SPA bucket name
    Value: !Ref PortalUiBucket

  PortalApiUrl:
    Condition: HasPortalApi
    Description: HTTPS invoke URL for the read-only portal API (API Gateway HTTP API)
    Value: !Sub 'https://${PortalHttpApi}.execute-api.${AWS::Region}.amazonaws.com'

  DispositionTableName:
    Description: DynamoDB table for synced ServiceNow closed dispositions
    Value: !Ref DispositionTable

  DispositionSyncFunctionName:
    Description: Lambda function name for ServiceNow disposition sync
    Value: !Ref DispositionSyncFunction

  PortalBrowserApiBaseUrl:
    Condition: HasPortalApi
    Description: Recommended browser API base URL for the SPA (no trailing slash)
    Value: !Sub 'https://${PortalHttpApi}.execute-api.${AWS::Region}.amazonaws.com'
