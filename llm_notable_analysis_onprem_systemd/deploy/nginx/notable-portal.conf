# Example nginx reverse proxy for the read-only Notable Analyst Portal.
#
# Replace notable-portal.internal.example.com and certificate paths before use.
# nginx terminates TLS and basic auth, serves the React SPA, then forwards API
# and probe traffic to loopback FastAPI.
# The included file must be root-owned and set X-Notable-Portal-Proxy-Secret
# to match PORTAL_PROXY_SECRET from /etc/notable-analyzer/portal.env.

limit_req_zone $binary_remote_addr zone=portal_chat:10m rate=5r/m;

server {
    listen 443 ssl http2;
    server_name notable-portal.internal.example.com;

    ssl_certificate /etc/nginx/tls/notable-portal.crt;
    ssl_certificate_key /etc/nginx/tls/notable-portal.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 1m;

    auth_basic "Notable Analyst Portal";
    auth_basic_user_file /etc/nginx/htpasswd/notable-portal;

    access_log /var/log/nginx/notable-portal.access.log;
    error_log /var/log/nginx/notable-portal.error.log warn;

    root /opt/notable-analyzer/frontend/analyst-portal/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/chat {
        limit_req zone=portal_chat burst=2 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-User $remote_user;
        include /etc/nginx/notable-portal-proxy-secret.conf;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-User $remote_user;
        include /etc/nginx/notable-portal-proxy-secret.conf;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location = /ready {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}

server {
    listen 80;
    server_name notable-portal.internal.example.com;
    return 301 https://$host$request_uri;
}
