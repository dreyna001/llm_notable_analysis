# Example nginx reverse proxy for the read-only Notable Analyst Portal.
#
# Replace notable-portal.internal.example.com and certificate paths before use.
# nginx terminates TLS and basic auth, then forwards to loopback FastAPI.
# If the portal is explicitly configured for a non-loopback bind, also set
# X-Notable-Portal-Proxy-Secret here from a protected nginx include file.

server {
    listen 443 ssl http2;
    server_name notable-portal.internal.example.com;

    ssl_certificate /etc/nginx/tls/notable-portal.crt;
    ssl_certificate_key /etc/nginx/tls/notable-portal.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 1m;

    auth_basic "Notable Analyst Portal";
    auth_basic_user_file /etc/nginx/htpasswd/notable-portal;

    access_log /var/log/nginx/notable-portal.access.log;
    error_log /var/log/nginx/notable-portal.error.log warn;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-User $remote_user;
        # proxy_set_header X-Notable-Portal-Proxy-Secret "<PORTAL_PROXY_SECRET>";
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    server_name notable-portal.internal.example.com;
    return 301 https://$host$request_uri;
}
