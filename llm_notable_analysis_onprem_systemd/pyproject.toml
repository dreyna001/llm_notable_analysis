[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-notable-analysis-onprem-systemd"
version = "0.1.0"
description = "On-prem systemd notable analysis service with local LLM inference"
requires-python = ">=3.10"
dependencies = [
    "requests==2.32.5",
    "onprem-llm-sdk==0.1.0",
    "faiss-cpu",
    "sentence-transformers",
    "numpy",
    "python-docx",
    "docx2txt",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"llm_notable_analysis_onprem_systemd.onprem_service" = ["enterprise_attack_v17.1_ids.json"]
