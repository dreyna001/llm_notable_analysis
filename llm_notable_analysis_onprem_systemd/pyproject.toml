[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-notable-analysis-onprem-systemd"
version = "0.1.0"
description = "On-prem systemd notable analysis service with local LLM inference"
requires-python = ">=3.12"
dependencies = [
    "requests==2.32.5",
    "onprem-llm-sdk==0.1.0",
    "onprem-rag-notable-analysis==0.1.0",
    "psycopg[binary]==3.3.4",
    "pgvector==0.4.2",
    "faiss-cpu==1.13.2",
    "sentence-transformers==5.4.1",
    "transformers==5.9.0",
    "huggingface-hub==1.16.4",
    "numpy==2.4.4",
    "python-docx==1.2.0",
    "docx2txt==0.9",
]

[project.optional-dependencies]
proxy = [
    "litellm[proxy]==1.83.14",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"llm_notable_analysis_onprem_systemd.onprem_service" = ["enterprise_attack_v17.1_ids.json"]
